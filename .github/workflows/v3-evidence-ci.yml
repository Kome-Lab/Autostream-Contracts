name: v3 evidence contract CI
on:
  push:
    branches: [v3-dev]
  pull_request:
    branches: [v3-dev]
permissions:
  contents: read
concurrency:
  group: v3-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  GOMAXPROCS: '2'
  GOTOOLCHAIN: local
  GOWORK: 'off'
  GOFLAGS: -mod=readonly
defaults:
  run:
    working-directory: v3evidence
jobs:
  v3-evidence-checks:
    name: v3-evidence-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Set up pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.5'
          check-latest: false
          cache: false
      - name: Verify module and Go version
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = go1.26.5
          test "$(awk '$1 == "go" { print $2 }' go.mod)" = 1.26.5
          test "$(go list -m)" = github.com/Kome-Lab/Autostream-Contracts/v3evidence
          go version
      - name: Check gofmt
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Test canonical evidence contracts
        run: go test -p 1 -count=1 -v ./...
      - name: Vet canonical evidence contracts
        run: go vet -p 1 ./...
      - name: Build canonical evidence module
        run: go build -p 1 ./...
      - name: Test without CGO
        run: CGO_ENABLED=0 go test -p 1 -count=1 ./...
      - name: Race-test canonical evidence contracts
        run: CGO_ENABLED=1 go test -race -p 1 -count=1 ./...
      - name: Cross-build Linux test binaries
        shell: bash
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" go test -p 1 -trimpath -c -o "${RUNNER_TEMP}/evidence-linux-${arch}.test"
            sha256sum "${RUNNER_TEMP}/evidence-linux-${arch}.test"
          done
      - name: Verify module files unchanged
        run: git diff --exit-code -- go.mod go.sum
