name: Generate contract characterization patch

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact Contracts commit to characterize
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: contracts-characterization-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - name: Verify exact source commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ inputs.source_sha }}"
      - name: Generate characterization artifacts
        run: node scripts/characterize-contracts.mjs update
      - name: Package generated-only patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --binary -- testdata/characterization/generated > characterization-generated.patch
          test -s characterization-generated.patch
          test -z "$(git status --short --untracked-files=all | grep -v '^.. testdata/characterization/generated/' | grep -v '^?? characterization-generated.patch$' || true)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: characterization-generated-${{ inputs.source_sha }}
          path: characterization-generated.patch
          if-no-files-found: error
          retention-days: 1
