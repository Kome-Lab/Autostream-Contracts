openapi: 3.1.0
info:
  title: AutoStream Control API
  version: 0.2.0
servers:
  - url: https://control.example.com
security:
  - cookieSession: []
paths:
  /health:
    get:
      security: []
      responses:
        "200":
          description: healthy
  /setup/first-admin:
    post:
      security: []
      responses:
        "201":
          description: first admin created
  /auth/login:
    post:
      security: []
      responses:
        "200":
          description: login succeeded
  /auth/oauth/providers:
    get:
      security: []
      responses:
        "200":
          description: enabled OAuth login providers without client secrets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OAuthLoginProvider"
  /auth/oauth/{id}/start:
    post:
      security: []
      parameters: [{$ref: "#/components/parameters/id"}]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthLoginStartRequest"
      responses:
        "200":
          description: OAuth authorization URL and one-time state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthLoginStartResponse"
  /auth/oauth/callback:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthLoginCallbackRequest"
      responses:
        "200":
          description: OAuth login succeeded and session cookie was issued
        "202":
          description: MFA challenge required
        "403":
          description: OAuth identity is not linked to a local user or not allowed
  /auth/logout:
    post:
      responses:
        "200":
          description: logout succeeded
  /auth/me:
    get:
      responses:
        "200":
          description: current user
  /auth/change-password:
    post:
      responses:
        "200":
          description: password changed
  /auth/mfa/enroll:
    post:
      responses:
        "202":
          description: TOTP enrollment started
  /auth/mfa/verify:
    post:
      responses:
        "200":
          description: MFA verified
  /auth/mfa/disable:
    post:
      responses:
        "200":
          description: MFA disabled
  /auth/recovery-codes/regenerate:
    post:
      responses:
        "200":
          description: recovery codes regenerated
  /auth/passkeys/register/start:
    post:
      parameters:
        - $ref: "#/components/parameters/csrfToken"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                display_name:
                  type: string
                  maxLength: 255
      responses:
        "201":
          description: Passkey registration challenge created. Response must be sent with Cache-Control no-store.
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyRegistrationStartResponse"
  /auth/passkeys/register/finish:
    post:
      parameters:
        - $ref: "#/components/parameters/csrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyRegistrationFinishRequest"
      responses:
        "201":
          description: Passkey credential registered for the current authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyCredential"
        "401":
          description: registration challenge is invalid, expired, or verification failed
  /auth/passkeys/login/start:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyLoginStartRequest"
      responses:
        "200":
          description: Passkey login challenge created. Response must be sent with Cache-Control no-store and must not enumerate users.
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyLoginStartResponse"
  /auth/passkeys/login/finish:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyLoginFinishRequest"
      responses:
        "200":
          description: Passkey login succeeded and session cookie was issued
        "202":
          description: Passkey assertion succeeded but TOTP MFA challenge is still required
        "401":
          description: challenge is invalid, expired, or assertion verification failed
        "403":
          description: MFA enrollment is required before login can continue
  /auth/passkeys:
    get:
      responses:
        "200":
          description: current user's public passkey credentials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PasskeyCredential"
  /auth/passkeys/{id}:
    delete:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/csrfToken"
      responses:
        "204":
          description: passkey deleted
        "404":
          description: passkey not found for current user
  /permissions:
    get:
      responses:
        "200":
          description: permission names
  /users:
    get:
      responses:
        "200":
          description: list users
    post:
      responses:
        "201":
          description: create user
  /users/{id}:
    get:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: user detail
    put:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: user updated
  /users/{id}/disable:
    post:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: user disabled
  /users/{id}/lock:
    post:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: user locked
  /users/{id}/unlock:
    post:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: user unlocked
  /users/{id}/reset-password:
    post:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: temporary password set
  /users/{id}/force-password-change:
    post:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: password change required
  /users/{id}/oauth-links:
    get:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: list OAuth login links for the user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OAuthUserLink"
    post:
      deprecated: true
      summary: Manual OAuth login links are disabled
      description: |
        Manual subject entry is disabled to avoid linking a local account to an
        attacker-controlled provider subject. OAuth user links are created only
        by the OAuth callback ceremony after state, nonce, provider identity,
        and allowlist checks succeed. This endpoint is retained only for legacy
        clients and always returns 403 manual_oauth_link_disabled.
      parameters: [{$ref: "#/components/parameters/id"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthUserLinkWriteRequest"
      responses:
        "403":
          description: manual OAuth subject link creation is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /users/{id}/oauth-links/{link_id}:
    delete:
      parameters:
        - $ref: "#/components/parameters/id"
        - name: link_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: OAuth login link deleted
  /roles:
    get:
      responses:
        "200":
          description: list roles
    post:
      responses:
        "201":
          description: create role
  /roles/{id}:
    get:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: role detail
    put:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: role updated
    delete:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: role deleted
  /streams:
    get:
      responses:
        "200":
          description: list streams
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StreamWriteRequest"
      responses:
        "201":
          description: create stream
  /streams/{id}:
    get:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: stream detail
  /streams/{id}/settings:
    put:
      parameters: [{$ref: "#/components/parameters/id"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StreamSettingsWriteRequest"
      responses:
        "200":
          description: stream settings updated
        "404":
          description: stream not found
  /streams/{id}/start-readiness:
    post:
      parameters: [{$ref: "#/components/parameters/id"}]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartStreamRequest"
      responses:
        "200":
          description: start readiness check result; no stream status change or service dispatch is attempted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartReadinessResponse"
  /streams/{id}/external-e2e-config:
    get:
      summary: Export non-secret external verification Control Panel confirmation
      description: >
        Returns the Control Panel-managed IDs and boolean confirmations needed by
        the external verification handoff file. Requires a cookie-authenticated user with
        streams.read. The response is always Cache-Control: no-store and never
        returns raw Discord guild/channel IDs, Drive folder IDs, OAuth refresh
        tokens, client secrets, RTMPS URLs, stream keys, service tokens, or
        session cookies.
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: non-secret external verification confirmation export
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always no-store because the response confirms runtime integration state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalE2EConfigResponse"
        "403":
          description: authenticated user does not have streams.read
        "404":
          description: stream not found
  /streams/{id}/start:
    post:
      parameters: [{$ref: "#/components/parameters/id"}]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartStreamRequest"
      responses:
        "200":
          description: stream started
        "409":
          description: required service assignments are missing; no dispatch is attempted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissingStreamAssignmentsResponse"
  /streams/{id}/stop:
    post:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: stream stopped
        "409":
          description: required service assignments are missing; no stop dispatch is attempted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissingStreamAssignmentsResponse"
  /streams/{id}/youtube/complete:
    post:
      description: Manually retry completion of a retained YouTube Live API runtime after stop or start-cleanup failure. Control Panel also retries retained runtimes automatically with backoff. Raw OAuth tokens and stream keys are never returned.
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: YouTube runtime completion retried or no retained runtime exists
        "502":
          description: YouTube Live API completion failed; runtime is retained for another retry
  /streams/{id}/mark-failed:
    post:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: stream marked failed
  /streams/{id}/retry-upload:
    post:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "202":
          description: archive upload retry queued
        "409":
          description: assigned encoder_recorder service is missing; no package retry dispatch is attempted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissingStreamAssignmentsResponse"
  /streams/{id}/encoder-preflight:
    get:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: assigned Encoder/Recorder preflight checks with secret values redacted
        "409":
          description: assigned Encoder/Recorder service is missing
  /streams/{id}/audio-status:
    get:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: Discord audio bridge status from the assigned Encoder/Recorder
        "409":
          description: assigned Encoder/Recorder service is missing
  /streams/{id}/worker-events:
    get:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: recent Worker events returned through the assigned Encoder/Recorder with secret values redacted
        "409":
          description: assigned Encoder/Recorder service is missing
  /streams/{id}/worker-events/test:
    post:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "202":
          description: test Worker event dispatched to the assigned Encoder/Recorder
        "409":
          description: assigned Encoder/Recorder service is missing
  /streams/{id}/logs:
    get:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: stream logs
  /streams/{id}/artifacts:
    get:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: stream artifacts
  /profiles/encoder:
    get: {$ref: "#/components/pathItems/listCreateProfile/get"}
    post: {$ref: "#/components/pathItems/listCreateProfile/post"}
  /profiles/encoder/{id}:
    get: {$ref: "#/components/pathItems/itemProfile/get"}
    put: {$ref: "#/components/pathItems/itemProfile/put"}
    delete: {$ref: "#/components/pathItems/itemProfile/delete"}
  /profiles/archive:
    get: {$ref: "#/components/pathItems/listCreateProfile/get"}
    post: {$ref: "#/components/pathItems/listCreateProfile/post"}
  /profiles/archive/{id}:
    get: {$ref: "#/components/pathItems/itemProfile/get"}
    put: {$ref: "#/components/pathItems/itemProfile/put"}
    delete: {$ref: "#/components/pathItems/itemProfile/delete"}
  /profiles/caption:
    get: {$ref: "#/components/pathItems/listCreateProfile/get"}
    post: {$ref: "#/components/pathItems/listCreateProfile/post"}
  /profiles/caption/{id}:
    get: {$ref: "#/components/pathItems/itemProfile/get"}
    put: {$ref: "#/components/pathItems/itemProfile/put"}
    delete: {$ref: "#/components/pathItems/itemProfile/delete"}
  /profiles/overlay:
    get: {$ref: "#/components/pathItems/listCreateProfile/get"}
    post: {$ref: "#/components/pathItems/listCreateProfile/post"}
  /profiles/overlay/{id}:
    get: {$ref: "#/components/pathItems/itemProfile/get"}
    put: {$ref: "#/components/pathItems/itemProfile/put"}
    delete: {$ref: "#/components/pathItems/itemProfile/delete"}
  /discord/configs:
    get:
      responses:
        "200":
          description: list Discord Bot configs without raw bot tokens
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiscordConfig"
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscordConfigWriteRequest"
      responses:
        "201":
          description: create Discord Bot config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordConfig"
  /discord/configs/{id}:
    get:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: Discord Bot config detail without raw bot token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordConfig"
    put:
      parameters: [{$ref: "#/components/parameters/id"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscordConfigWriteRequest"
      responses:
        "200":
          description: update Discord Bot config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordConfig"
    delete:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: Discord Bot config deleted
  /youtube/outputs:
    get:
      responses:
        "200":
          description: list YouTube outputs without raw stream keys or OAuth refresh tokens
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/YouTubeOutput"
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/YouTubeOutputWriteRequest"
      responses:
        "201":
          description: create YouTube output
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YouTubeOutput"
  /youtube/outputs/{id}:
    get:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: YouTube output detail without raw stream key or OAuth refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YouTubeOutput"
    put:
      parameters: [{$ref: "#/components/parameters/id"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/YouTubeOutputWriteRequest"
      responses:
        "200":
          description: update YouTube output
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YouTubeOutput"
    delete:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: YouTube output deleted
  /workers:
    get:
      responses:
        "200":
          description: list worker services
  /workers/{id}:
    get:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: worker detail
  /workers/{id}/assign:
    post:
      parameters: [{$ref: "#/components/parameters/id"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceAssignmentWriteRequest"
      responses:
        "200":
          description: worker assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisteredService"
  /workers/{id}/assignment:
    delete:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: worker unassigned from its current stream
  /workers/{id}/restart:
    post:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "202":
          description: worker restart requested
  /api-tokens:
    get:
      responses:
        "200":
          description: list service/API tokens without raw token values
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceToken"
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceTokenCreateRequest"
      responses:
        "201":
          description: create token and show raw token once. If service_id is present, a pending service registry entry is also created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceToken"
        "409":
          description: service_id already exists when precreating a service registry entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api-tokens/{id}:
    post:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "201":
          description: revoke the old token, create a replacement token, rebind linked services, and show the new raw token once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceToken"
        "403":
          description: caller lacks api_tokens.revoke
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: token not found or already revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: token revoked
  /services/register:
    post:
      security:
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceRegistrationRequest"
      responses:
        "202":
          description: service registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisteredService"
        "400":
          description: invalid service registration payload or outbound-policy-blocked public URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /services/runtime-config:
    get:
      security:
        - bearerToken: []
      description: Service-token endpoint for a registered service to fetch only its own assignments and Control Panel-managed non-secret runtime profiles. Requires service.config.read.
      parameters:
        - name: service_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: runtime config for the authenticated service
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always no-store because runtime config includes assignments and runtime secret reference names.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRuntimeConfig"
        "403":
          description: token does not own the requested service_id or lacks service.config.read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /services/runtime-secrets/resolve:
    post:
      security:
        - bearerToken: []
      description: Service-token endpoint for resolving a short-lived raw runtime secret that is explicitly referenced by the authenticated service runtime config or an assigned stream archive runtime config. Requires service.secret.resolve. A server-side lease prevents the same service/context/secret from being resolved repeatedly during the returned expires_in_sec window. This endpoint is not for browser UI use and responses must not be cached, logged, audited with raw values, or exposed to the frontend.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceRuntimeSecretResolveRequest"
      responses:
        "200":
          description: one-time runtime secret for the authenticated service
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always no-store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRuntimeSecretResolveResponse"
        "403":
          description: token does not own service_id, lacks service.secret.resolve, or secret_name is not referenced by that service runtime config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: service or configured secret was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: runtime secret lease is still active for the same service/context/secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /services/heartbeat:
    post:
      security:
        - bearerToken: []
      responses:
        "202":
          description: heartbeat accepted
  /services/observability/signals:
    post:
      security:
        - bearerToken: []
      description: Worker and Encoder/Recorder report Observability signals through Control Panel with a Node Runtime Token. Requires observability.ingest. Control Panel overwrites service_id and service_type from the registered service before forwarding to Observability.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceObservabilitySignal"
      responses:
        "202":
          description: signal accepted for forwarding
        "400":
          description: invalid signal payload
        "401":
          description: missing or invalid service token
        "403":
          description: wrong service type, pending service, or missing observability.ingest scope
        "502":
          description: Observability API is unavailable or rejected the forwarded signal
  /services/stream-events:
    post:
      security:
        - bearerToken: []
      responses:
        "202":
          description: service stream event accepted
  /services/stream-artifacts:
    post:
      security:
        - bearerToken: []
      description: Assigned Encoder/Recorder reports logical archive artifacts. Requires encoder.status.write.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceArtifactReport"
      responses:
        "202":
          description: artifact report accepted
        "400":
          description: invalid artifact metadata or unsafe relative path
        "403":
          description: wrong service type, missing scope, or service is not assigned to the stream
  /services/remediation-actions/execute:
    post:
      security:
        - bearerToken: []
      description: Observability requests an approved remediation dispatch. Requires remediation.execute. action_id, incident_id, and stream_id are required correlation context. Control Panel verifies the context against Observability read API and rejects duplicate action_id replays before service dispatch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceRemediationExecuteRequest"
      responses:
        "202":
          description: remediation dispatch accepted
        "400":
          description: missing action_id, incident_id, stream_id, or unsupported action
        "403":
          description: wrong service type, missing remediation scope, or remediation context not verified
        "409":
          description: duplicate action_id replay or missing stream assignment
