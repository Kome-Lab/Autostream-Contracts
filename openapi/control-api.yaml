          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
    PasskeyRegistrationStartResponse:
      type: object
      required: [registration_token, expires_at, public_key]
      properties:
        registration_token:
          type: string
          description: Short-lived one-time token returned only to the current authenticated user.
        expires_at:
          type: string
          format: date-time
        public_key:
          type: object
          required: [challenge, rp, user, pubKeyCredParams, timeout, attestation, authenticatorSelection]
          properties:
            challenge:
              type: string
            rp:
              type: object
              required: [id, name]
              properties:
                id:
                  type: string
                name:
                  type: string
            user:
              type: object
              required: [id, name, displayName]
              properties:
                id:
                  type: string
                name:
                  type: string
                displayName:
                  type: string
            pubKeyCredParams:
              type: array
              items:
                type: object
                required: [type, alg]
                properties:
                  type:
                    const: public-key
                  alg:
                    type: integer
            timeout:
              type: integer
            attestation:
              type: string
            authenticatorSelection:
              type: object
              required: [residentKey, userVerification]
              properties:
                residentKey:
                  type: string
                userVerification:
                  type: string
    PasskeyRegistrationFinishRequest:
      type: object
      additionalProperties: false
      required: [registration_token, credential]
      properties:
        registration_token:
          type: string
          description: One-time registration token returned by /auth/passkeys/register/start.
        name:
          type: string
          maxLength: 255
          description: Optional operator-visible passkey label.
        credential:
          type: object
