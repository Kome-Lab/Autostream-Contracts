      properties:
        app_name:
          type: string
          minLength: 1
          maxLength: 80
        timezone:
          type: string
          minLength: 1
          maxLength: 64
        google_analytics_enabled:
          type: boolean
        google_analytics_measurement_id:
          type: string
          pattern: "^G-[A-Z0-9]{4,22}$"
        smtp_enabled:
          type: boolean
        smtp_host:
          type: string
          maxLength: 255
        smtp_port:
          type: integer
          minimum: 1
          maximum: 65535
        smtp_starttls:
          type: boolean
        smtp_from:
          type: string
          maxLength: 512
        smtp_username:
          type: string
          maxLength: 255
        smtp_password_configured:
          type: boolean
          description: Configured status only. The SMTP password is never returned.
        turnstile_enabled:
          type: boolean
        turnstile_site_key:
          type: string
          maxLength: 255
        turnstile_configured:
          type: boolean
          description: Configured status only. The Turnstile secret is never returned.
        updated_at:
          type: string
          format: date-time
    AppSettingsWriteRequest:
      type: object
      additionalProperties: false
      required: [app_name, timezone]
      allOf:
        - if:
