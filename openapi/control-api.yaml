openapi: 3.1.0
info:
  title: AutoStream Control API
  version: 0.2.0
servers:
  - url: https://control.example.com
security:
  - cookieSession: []
paths:
  /health:
    get:
      security: []
      responses:
        "200":
          description: healthy
  /updater/version:
    get:
      operationId: getUpdaterVersion
      summary: Read the running binary's embedded release version
      description: >
        Unauthenticated endpoint for the host-local update helper. Deployments must
        keep this path on loopback or block it at the public reverse proxy. The value
        comes from the running binary and never from SERVICE_VERSION.
      security: []
      responses:
        "200":
          description: embedded release version
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [version]
                properties:
                  version:
                    type: string
                    pattern: '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$'
                    example: v1.1.1

  /setup/first-admin:
    post:
      security: []
      responses:
        "201":
          description: first admin created
  /auth/login:
    post:
      security: []
      responses:
        "200":
          description: login succeeded
  /auth/oauth/providers:
    get:
      security: []
      responses:
        "200":
          description: enabled OAuth login providers without client secrets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OAuthLoginProvider"
  /auth/oauth/{id}/start:
    post:
      security: []
      parameters: [{$ref: "#/components/parameters/id"}]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthLoginStartRequest"
      responses:
        "200":
          description: OAuth authorization URL and one-time state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthLoginStartResponse"
  /auth/oauth/callback:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthLoginCallbackRequest"
      responses:
        "200":
          description: OAuth login succeeded and session cookie was issued
        "202":
          description: MFA challenge required
        "403":
          description: OAuth identity is not linked to a local user or not allowed
  /auth/logout:
    post:
      responses:
        "200":
          description: logout succeeded
  /auth/session/refresh:
    post:
      description: Explicitly extends the idle expiry for an authenticated active browser session without extending its absolute lifetime.
      parameters:
        - $ref: "#/components/parameters/csrfToken"
      responses:
        "200":
          description: session idle expiry refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRefreshResponse"
        "401":
          description: session is missing, idle-expired, or absolute-expired
  /auth/me:
    get:
      responses:
        "200":
          description: current user
  /auth/change-password:
    post:
      responses:
        "200":
          description: password changed
  /auth/mfa/enroll:
    post:
      responses:
        "202":
          description: TOTP enrollment started
  /auth/mfa/verify:
    post:
      responses:
        "200":
          description: MFA verified
  /auth/mfa/disable:
    post:
      responses:
        "200":
          description: MFA disabled
  /auth/recovery-codes/regenerate:
    post:
      responses:
        "200":
          description: recovery codes regenerated
  /auth/passkeys/register/start:
    post:
      parameters:
        - $ref: "#/components/parameters/csrfToken"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                display_name:
                  type: string
                  maxLength: 255
      responses:
        "201":
          description: Passkey registration challenge created. Response must be sent with Cache-Control no-store.
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyRegistrationStartResponse"
  /auth/passkeys/register/finish:
    post:
      parameters:
        - $ref: "#/components/parameters/csrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyRegistrationFinishRequest"
      responses:
        "201":
          description: Passkey credential registered for the current authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyCredential"
        "401":
          description: registration challenge is invalid, expired, or verification failed
  /auth/passkeys/login/start:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyLoginStartRequest"
      responses:
        "200":
          description: Passkey login challenge created. Response must be sent with Cache-Control no-store and must not enumerate users.
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyLoginStartResponse"
  /auth/passkeys/login/finish:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyLoginFinishRequest"
      responses:
        "200":
          description: Passkey login succeeded and session cookie was issued
        "202":
          description: Passkey assertion succeeded but TOTP MFA challenge is still required
        "401":
          description: challenge is invalid, expired, or assertion verification failed
        "403":
          description: MFA enrollment is required before login can continue
  /auth/passkeys:
    get:
      responses:
        "200":
          description: current user's public passkey credentials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PasskeyCredential"
  /auth/passkeys/{id}:
    delete:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/csrfToken"
      responses:
        "204":
          description: passkey deleted
        "404":
          description: passkey not found for current user
  /permissions:
    get:
      responses:
        "200":
          description: permission names
  /users:
    get:
      responses:
        "200":
          description: list users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateRequest"
      responses:
        "201":
          description: create user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /users/{id}:
    get:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: user detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    put:
      parameters: [{$ref: "#/components/parameters/id"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateRequest"
      responses:
        "200":
          description: user updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /users/{id}/disable:
    post:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: user disabled
  /users/{id}/lock:
    post:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: user locked
  /users/{id}/unlock:
    post:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: user unlocked
  /users/{id}/reset-password:
    post:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: temporary password set
  /users/{id}/force-password-change:
    post:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: password change required
  /users/{id}/oauth-links:
    get:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: list OAuth login links for the user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OAuthUserLink"
    post:
      deprecated: true
      summary: Manual OAuth login links are disabled
      description: |
        Manual subject entry is disabled to avoid linking a local account to an
        attacker-controlled provider subject. OAuth user links are created only
        by the OAuth callback ceremony after state, nonce, provider identity,
        and allowlist checks succeed. This endpoint is retained only for legacy
        clients and always returns 403 manual_oauth_link_disabled.
      parameters: [{$ref: "#/components/parameters/id"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthUserLinkWriteRequest"
      responses:
        "403":
          description: manual OAuth subject link creation is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /users/{id}/oauth-links/{link_id}:
    delete:
      parameters:
        - $ref: "#/components/parameters/id"
        - name: link_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: OAuth login link deleted
  /roles:
    get:
      responses:
        "200":
          description: list roles
    post:
      responses:
        "201":
          description: create role
  /roles/{id}:
    get:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: role detail
    put:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: role updated
    delete:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: role deleted
  /streams:
    get:
      responses:
        "200":
          description: list streams
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StreamWriteRequest"
      responses:
        "201":
          description: create stream
  /streams/{id}:
    get:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: stream detail
    delete:
      parameters: [{$ref: "#/components/parameters/id"}]
      description: >
        Delete a non-active stream, its persisted settings, logs, artifacts,
        runtime state, and service assignments. Requires streams.delete. Active
        streams remain protected and return 409 until stopped.
      responses:
        "200":
          description: stream deleted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, stream_id]
                properties:
                  status:
                    type: string
                    enum: [deleted]
                  stream_id:
                    type: string
        "403":
          description: authenticated user does not have streams.delete
        "404":
          description: stream not found
        "409":
          description: active stream cannot be deleted or youtube_relay_binding_release_pending; a fixed relay binding must be released through its safe lifecycle before deletion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: youtube_relay_binding_claim_check_failed; Control Panel could not determine whether a fixed relay binding remains claimed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /streams/{id}/settings:
    put:
      parameters: [{$ref: "#/components/parameters/id"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StreamSettingsWriteRequest"
      responses:
        "200":
          description: stream settings updated
        "404":
          description: stream not found
        "409":
          description: stream_status_not_editable or youtube_relay_binding_release_pending; a fixed relay binding must be released through its safe lifecycle before changing the selected YouTube output.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: youtube_relay_binding_claim_check_failed; Control Panel could not determine whether a fixed relay binding remains claimed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /streams/{id}/runtime-settings:
    put:
      summary: Persist and, when live, immediately apply Encoder gain and watermark settings
      parameters: [{$ref: "#/components/parameters/id"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EncoderRuntimeSettingsRequest"
      responses:
        "200": {description: settings persisted and applied when the stream is live}
        "400": {description: invalid gain or watermark profile}
        "404": {description: stream not found}
        "409": {description: stream is starting or stopping}
        "502": {description: assigned Encoder could not apply the live settings; desired settings remain persisted}
  /streams/{id}/start-readiness:
    post:
      parameters: [{$ref: "#/components/parameters/id"}]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartStreamRequest"
      responses:
        "200":
          description: start readiness check result; no stream status change or service dispatch is attempted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartReadinessResponse"
  /streams/{id}/external-e2e-config:
    get:
      summary: Export non-secret external verification Control Panel confirmation
      description: >
        Returns the Control Panel-managed IDs and boolean confirmations needed by
        the external verification handoff file. Requires a cookie-authenticated user with
        streams.read. The response is always Cache-Control: no-store and never
        returns raw Discord guild/channel IDs, Drive folder IDs, OAuth refresh
        tokens, client secrets, RTMPS URLs, stream keys, service tokens, or
        session cookies.
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: non-secret external verification confirmation export
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always no-store because the response confirms runtime integration state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalE2EConfigResponse"
        "403":
          description: authenticated user does not have streams.read
        "404":
          description: stream not found
  /streams/{id}/start:
    post:
      description: >
        Starts every assigned primary service. When a public YouTube watch URL and Discord
        text target are selected, Control Panel atomically enqueues a durable notification
        intent with the live stream transition; a successful start response means queued,
        not delivered. live_api and live_api_relay_static wait for the provider Broadcast
        lifecycle to be live. stream_key remains a legacy_unverified compatibility path.
        A transport-ambiguous Bot result becomes delivery_unknown and never auto-retries;
        an operator may explicitly attest and request a new event through the recovery path.
        Audit metadata stores only a watch URL fingerprint.
      parameters: [{$ref: "#/components/parameters/id"}]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartStreamRequest"
      responses:
        "200":
          description: stream started
        "409":
          description: required service assignments are missing; no dispatch is attempted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissingStreamAssignmentsResponse"
  /streams/{id}/youtube-live-notification:
    get:
      operationId: getDiscordYouTubeLiveNotification
      description: >
        Returns the latest durable Discord YouTube-live notification state for a stream.
        It contains only the public watch URL, Discord target IDs, lifecycle state, and a
        confirmed Discord message receipt where available. Event IDs, OAuth credentials,
        stream keys, and raw Bot errors are never returned.
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: latest notification state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordYouTubeLiveNotificationResponse"
        "403":
          description: authenticated user does not have streams.read
        "404":
          description: not_found or discord_youtube_notification_not_found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: get_stream_failed or get_discord_youtube_notification_failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: discord_youtube_notification_outbox_unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /streams/{id}/youtube-live-notifications/{notification_id}/recover:
    post:
      operationId: recoverDiscordYouTubeLiveNotification
      description: >
        Requires streams.start and explicit acknowledgement that the original ambiguous
        request might already have posted to Discord. Only delivery_unknown records on a
        still-live stream may be recovered. This creates a new event ID and does not reopen
        or automatically retry the original event.
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/notificationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscordYouTubeLiveNotificationRecoveryRequest"
      responses:
        "202":
          description: recovery notification intent created with a new event ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordYouTubeLiveNotificationResponse"
        "400":
          description: duplicate_risk_acknowledgement_required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: authenticated user does not have streams.start
        "404":
          description: discord_youtube_notification_not_found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: discord_youtube_notification_recovery_not_allowed or discord_youtube_notification_recovery_already_requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: recover_discord_youtube_notification_failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: discord_youtube_notification_outbox_unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /streams/{id}/stop:
    post:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: stream stopped
        "409":
          description: required service assignments are missing; no stop dispatch is attempted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissingStreamAssignmentsResponse"
  /streams/{id}/youtube/complete:
    post:
      description: Manually retry completion of a retained YouTube Live API runtime after stop or start-cleanup failure. Control Panel also retries retained runtimes automatically with backoff. Raw OAuth tokens and stream keys are never returned.
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: YouTube runtime completion retried or no retained runtime exists
        "409":
          description: youtube_relay_static_completion_requires_completed_stream; a fixed-relay runtime may be completed only after its stream is completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: YouTube Live API completion failed; runtime is retained for another retry
  /streams/{id}/youtube/relay-static/recovery/resolve:
    post:
      operationId: resolveYouTubeRelayStaticRecovery
      description: >
        Explicitly resolves a live_api_relay_static recovery claim. Requires streams.stop.
        When Control Panel knows an unstarted YouTube Broadcast ID, it deletes that Broadcast
        (a provider 404 is also confirmed cleanup). For a possibly-dispatched stream, it first
        requires the assigned Encoder to acknowledge stop, then completes the Broadcast. When a
        broadcast insert response was lost, confirm_external_cleanup must attest to out-of-band
        cleanup. After a confirmed Encoder stop, the same attestation may also resolve a known
        Broadcast whose provider completion outcome could not be confirmed. This endpoint never returns a stream key, OAuth credential, provider error body,
        or RTMPS ingest address.
      parameters: [{$ref: "#/components/parameters/id"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/YouTubeRelayStaticRecoveryResolveRequest"
      responses:
        "200":
          description: Fixed relay recovery claim resolved and released.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YouTubeRelayStaticRecoveryResolveResponse"
        "400":
          description: bad_request or youtube_relay_static_external_cleanup_confirmation_required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: permission_denied; requires streams.stop
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: not_found or youtube_relay_static_recovery_not_found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: stream_relay_recovery_not_safe_while_active, youtube_relay_static_recovery_not_required, youtube_relay_static_recovery_encoder_stop_unavailable, youtube_relay_static_recovery_broadcast_unknown, youtube_relay_static_recovery_dispatch_state_invalid, or youtube_oauth_account_unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: get_stream_failed, get_youtube_relay_static_recovery_failed, youtube_relay_static_recovery_credentials_failed, or resolve_youtube_relay_static_recovery_failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: youtube_relay_static_recovery_cleanup_failed, youtube_relay_static_recovery_encoder_stop_unconfirmed, or youtube_relay_static_recovery_complete_failed; the relay claim is retained.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: youtube_relay_binding_store_unavailable or youtube_relay_static_recovery_cleanup_unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /streams/{id}/mark-failed:
    post:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: stream marked failed
  /streams/{id}/retry-upload:
    post:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "202":
          description: archive upload retry queued
        "409":
          description: assigned encoder_recorder service is missing; no package retry dispatch is attempted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissingStreamAssignmentsResponse"
  /streams/{id}/encoder-preflight:
    get:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: assigned Encoder/Recorder preflight checks with secret values redacted
        "409":
          description: assigned Encoder/Recorder service is missing
  /streams/{id}/preview/{name}:
    get:
      summary: Read an active stream HLS preview asset
      description: >
        Proxies the selected primary Encoder/Recorder preview through Control Panel.
        Requires streams.read. Only index.m3u8 and segment-NNNNNN.ts are accepted, and
        the stream must be starting, live, or stopping. The assigned Node token is never
        returned to the browser. Preview retrieval never rolls the live stream.
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/previewAssetName"
      responses:
        "200":
          description: HLS playlist or MPEG-TS segment
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store for playlists; private, max-age=30 for segments
            Referrer-Policy:
              schema:
                type: string
              description: no-referrer
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
            video/mp2t:
              schema:
                type: string
                format: binary
        "400":
          description: invalid preview asset name
        "404":
          description: stream or preview asset is not ready
        "409":
          description: stream is not active or required primary assignment is missing
        "502":
          description: Encoder/Recorder preview fetch failed or returned an unsafe playlist
  /streams/{id}/preview-links:
    post:
      summary: Create a VLC-compatible signed HLS preview link
      description: >
        Creates a bearer-capability URL for the active stream. Requires streams.read and
        CSRF protection. The link expires after 12 hours at most and becomes invalid as
        soon as the stream is no longer starting, live, or stopping. The URL itself must
        not be written to logs, audit metadata, tickets, or chat.
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/csrfToken"
      responses:
        "201":
          description: signed public HLS link created
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamPreviewLink"
        "409":
          description: stream is not active or required primary assignment is missing
        "503":
          description: preview proxy or signing key is unavailable
  /stream-previews/{token}/{name}:
    get:
      security: []
      summary: Read a signed public HLS preview asset
      description: >
        Public capability endpoint used by VLC and other HLS players. The signature is
        bound to one stream and external_player purpose. Playlist URIs remain relative so
        segment requests reuse the same signed path. The URL expires after 12 hours at
        most and returns 410 after the stream stops.
      parameters:
        - name: token
          in: path
          required: true
          description: Signed bearer capability. Never log or expose this value.
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/previewAssetName"
      responses:
        "200":
          description: HLS playlist or MPEG-TS segment
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store for playlists; private, max-age=30 for segments
            Referrer-Policy:
              schema:
                type: string
              description: no-referrer
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
            video/mp2t:
              schema:
                type: string
                format: binary
        "404":
          description: signed token or preview asset is invalid, expired, or not ready
        "410":
          description: stream is no longer active
  /stream-previews/{token}/participants:
    get:
      security: []
      summary: Read the current Discord voice participants for a signed preview
      description: >
        Returns non-secret display metadata from the latest worker participant
        snapshot. The preview bearer token authorizes this request; Discord
        credentials and service tokens are never returned.
      parameters:
        - name: token
          in: path
          required: true
          description: Signed bearer capability. Never log or expose this value.
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Current voice participants and active speaker state
          content:
            application/json:
              schema:
                type: object
                required: [participants]
                properties:
                  participants:
                    type: array
                    items:
                      type: object
                      required: [user_id]
                      properties:
                        user_id: {type: string}
                        display_name: {type: string}
                        avatar_url: {type: string, format: uri}
                        is_bot: {type: boolean}
                        speaking: {type: boolean}
                  active_speaker_id: {type: string}
                  updated_at: {type: string, format: date-time}
        "404":
          description: signed token is invalid or expired
        "410":
          description: stream is no longer active
        "502":
          description: worker participant events could not be read
        "503":
          description: preview participant service is unavailable
  /streams/{id}/audio-status:
