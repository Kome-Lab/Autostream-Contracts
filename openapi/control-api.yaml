            properties:
              operation:
                enum: [port_reconfigure, port_reconfigure_reconcile]
          then:
            required: [job_operation, port_reconfigure, transport_mode, service_type, ownership_epoch, policy_revision]
            properties:
              job_operation: {const: port_reconfigure}
              transport_mode: {const: pull_v2}
              service_type:
                enum: [discord_bot, encoder_recorder, observability, worker]
              policy_revision: {minimum: 1}
            oneOf:
              - properties:
                  deployment_mode: {const: systemd}
                  port_reconfigure:
                    not:
                      required: [docker]
                    properties:
                      old_port: {minimum: 1024}
                      new_port: {minimum: 1024}
              - properties:
                  deployment_mode: {const: docker}
                  port_reconfigure:
                    required: [docker]
          else:
            properties:
              job_operation: {const: software_update}
            not:
              required: [port_reconfigure]
        - if:
            required: [transport_mode]
            properties:
              transport_mode: {const: pull_v2}
          then:
            required: [ownership_epoch, policy_revision]
            properties:
              policy_revision: {minimum: 1}
      required: [lease_generation, host_id, target_id, target_version, deployment_mode, operation, plan_sha256, session_id]
      properties:
        lease_generation: {type: integer, format: int64, minimum: 1}
        host_id:
          type: string
          minLength: 1
          maxLength: 191
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,190}$"
        transport_mode:
          type: string
          enum: [ssh_v1, pull_v2]
        ownership_epoch: {type: integer, format: int64, minimum: 1}
        policy_revision: {type: integer, format: int64, minimum: 0}
        target_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
        service_type:
          type: string
          enum: [control_panel, discord_bot, encoder_recorder, observability, worker]
        target_version:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[^\u0000-\u001F\u007F]+$'
        deployment_mode:
          type: string
          enum: [systemd, docker]
        job_operation:
          type: string
          enum: [software_update, port_reconfigure]
        operation:
          type: string
          enum: [apply, reconcile, port_reconfigure, port_reconfigure_reconcile]
        plan_sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
          description: Lease/session-bound executor plan digest. For port operations it must equal port_reconfigure.port_plan_sha256.
        port_reconfigure:
          $ref: "#/components/schemas/SystemUpdatePortMutationGrantBinding"
        session_id:
          type: string
          minLength: 16
          maxLength: 128
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{15,127}$"
