        reachability_code: {type: string, maxLength: 128, pattern: "^[a-z0-9_.-]+$"}
        ssh_client_public_key:
          type: string
          maxLength: 80
          pattern: "^ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAI[A-Za-z0-9+/]{43}$"
        ssh_client_key_fingerprint:
          type: string
          maxLength: 50
          pattern: "^SHA256:[A-Za-z0-9+/]{43}$"
    SystemUpdatesResponse:
