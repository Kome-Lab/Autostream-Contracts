  /integrations/oauth-accounts/start:
    post:
      summary: Start OAuth consent for a connected operational account
      description: >
        Returns a one-time authorization URL. Supplying oauth_account_id starts a
        re-link flow that preserves the existing account ID; provider_id is then
        derived when omitted. Raw client secrets and refresh tokens are never returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthAccountConnectionStartRequest"
      responses:
        "200":
          description: OAuth consent URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthAccountConnectionStartResponse"
        "400":
          description: Invalid request or unsupported account_purpose
        "403":
          description: Missing integrations.create or integrations.update permission
        "404":
          description: Referenced OAuth account or provider not found
        "409":
          description: Referenced OAuth account/provider mismatch or provider cannot be used for connected accounts
        "500":
          description: OAuth provider or one-time state lookup/create failed
  /integrations/oauth-accounts/callback:
    get:
      summary: Browser OAuth callback for connected accounts
      description: Consumes state/code, stores the refresh token encrypted, then redirects to a safe local path.
      parameters:
        - name: state
          in: query
          required: true
          schema: {type: string}
        - name: code
          in: query
          required: true
          schema: {type: string}
        - name: provider_id
          in: query
          required: false
          schema: {type: string}
      responses:
        "303":
          description: Connected account created and browser redirected
    post:
      summary: API OAuth callback for connected accounts
      description: >
        Consumes state/code and returns public connected-account metadata only.
        A newly created account returns 201; a re-linked account keeps its account
        ID and returns 200. The returned OAuthAccount carries account_purpose and scopes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthAccountConnectionCallbackRequest"
      responses:
        "200":
          description: Connected account relinked while retaining its account ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthAccount"
        "201":
          description: Connected account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthAccount"
        "400":
          description: Invalid callback request or connected-account persistence failed
        "401":
          description: Invalid, expired, or browser-state-mismatched OAuth state/code
        "403":
          description: Missing required permission or verified OAuth identity is not allowed
        "404":
          description: Target OAuth account no longer exists during a re-link
        "409":
          description: Provider, identity, redirect, scope, or refresh-token condition prevents completion
        "500":
          description: OAuth state/account persistence failed
        "503":
          description: Encryption material required to persist the refresh token is unavailable
  /integrations/oauth-accounts/{id}:
    get:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: OAuth account detail without raw refresh token
    put:
      parameters: [{$ref: "#/components/parameters/id"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthAccountLabelUpdateRequest"
      responses:
        "200":
          description: OAuth account label updated without changing identity or refresh token
        "403":
          description: manual OAuth refresh token update is disabled
    delete:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: OAuth account deleted
        "409":
          description: oauth_account_in_use when Drive destinations, YouTube outputs, or active YouTube runtime metadata still reference this account
  /archive/destinations:
    get:
      responses:
        "200":
          description: list Drive archive destinations without raw folder IDs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DriveDestination"
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DriveDestinationWriteRequest"
      responses:
        "201":
          description: Drive archive destination created
  /archive/destinations/{id}:
    get:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: Drive archive destination detail without raw folder ID
    put:
      parameters: [{$ref: "#/components/parameters/id"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DriveDestinationWriteRequest"
      responses:
        "200":
          description: Drive archive destination updated
    delete:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: Drive archive destination deleted
components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: autostream_session
    bearerToken:
      type: http
      scheme: bearer
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
    notificationId:
      name: notification_id
      in: path
      required: true
      schema:
        type: string
    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
    csrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Required for unsafe cookie-authenticated requests.
      schema:
        type: string
    previewAssetName:
      name: name
      in: path
      required: true
      description: HLS playlist or six-digit MPEG-TS segment name.
      schema:
        type: string
        pattern: "^(index\\.m3u8|segment-[0-9]{6}\\.ts)$"
    auditActionGroup:
      name: action_group
      in: query
      required: false
      schema:
        type: string
        enum: [all, service_assignment, service_runtime, stream_lifecycle, security, secrets, notifications]
    auditAction:
      name: action
      in: query
      required: false
      description: comma-separated audit action names
      schema:
        type: string
    auditResult:
      name: result
      in: query
      required: false
      schema:
        type: string
        enum: [success, failure]
    auditQuery:
      name: q
      in: query
      required: false
      schema:
        type: string
  pathItems:
    listCreateProfile:
      get:
        responses:
          "200":
            description: list resources
      post:
        responses:
          "201":
            description: create resource
    itemProfile:
      get:
        parameters: [{$ref: "#/components/parameters/id"}]
        responses:
          "200":
            description: resource detail
      put:
        parameters: [{$ref: "#/components/parameters/id"}]
        responses:
          "200":
            description: resource updated
      delete:
        parameters: [{$ref: "#/components/parameters/id"}]
        responses:
          "200":
            description: resource deleted
  schemas:
    SystemUpdatePullOwnershipActivateRequest:
      type: object
      additionalProperties: false
      required:
        - expected_execution_host_id
        - expected_ownership_epoch
        - expected_source_policy_revision
        - expected_projection_revision
        - expected_local_executor_policy_revision
        - expected_local_executor_policy_sha256
      description: Strict compare-and-swap expectations for the pre-created updater selected by the path. No credential or client-selected replacement owner is accepted.
      properties:
        expected_execution_host_id:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,190}$"
        expected_ownership_epoch:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775806
        expected_source_policy_revision:
          type: integer
          format: int64
          minimum: 1
          description: Source policy revision used only for derivation/audit compare-and-swap.
        expected_projection_revision:
          type: integer
          format: int64
          minimum: 1
          description: Host Agent projection revision that becomes the ownership, job, and mutation-grant policy fence.
        expected_local_executor_policy_revision:
          type: integer
          format: int64
          minimum: 1
        expected_local_executor_policy_sha256:
          type: string
          pattern: "^sha256:[a-f0-9]{64}$"
    SystemUpdatePullOwnershipActivateResponse:
      type: object
      additionalProperties: false
      required:
        - updater_id
        - execution_host_id
        - transport_mode
        - agent_service_id
        - ownership_epoch
        - source_policy_revision
        - projection_revision
        - local_executor_policy_revision
        - local_executor_policy_sha256
      description: Server-owned pull_v2 ownership and policy fences after atomic activation. No credential or secret is returned.
      properties:
        updater_id:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
        execution_host_id:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,190}$"
        transport_mode:
          const: pull_v2
        agent_service_id:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
        ownership_epoch:
          type: integer
          format: int64
          minimum: 1
        source_policy_revision:
          type: integer
          format: int64
          minimum: 1
          description: Source policy revision retained for derivation and audit.
        projection_revision:
          type: integer
          format: int64
          minimum: 1
          description: Canonical ownership, job, and mutation-grant policy fence.
        local_executor_policy_revision:
          type: integer
          format: int64
          minimum: 1
        local_executor_policy_sha256:
          type: string
          pattern: "^sha256:[a-f0-9]{64}$"
    SystemUpdatePullOwnershipDeactivateRequest:
      type: object
      additionalProperties: false
      required:
        - expected_execution_host_id
        - expected_ownership_epoch
        - expected_source_policy_revision
        - expected_projection_revision
        - expected_local_executor_policy_revision
        - expected_local_executor_policy_sha256
      description: Strict compare-and-swap expectations for returning the path-selected pull updater to observer mode. The legacy ssh_v1 owner is server-preserved and cannot be selected by the client.
      properties:
        expected_execution_host_id:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,190}$"
        expected_ownership_epoch:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775806
        expected_source_policy_revision:
          type: integer
          format: int64
          minimum: 1
          description: Source pull-policy revision used for compare-and-swap and audit.
        expected_projection_revision:
          type: integer
          format: int64
          minimum: 1
          description: Pull projection revision currently fencing ownership, jobs, and mutation grants.
        expected_local_executor_policy_revision:
          type: integer
          format: int64
          minimum: 1
        expected_local_executor_policy_sha256:
          type: string
          pattern: "^sha256:[a-f0-9]{64}$"
    SystemUpdatePullOwnershipDeactivateResponse:
      type: object
      additionalProperties: false
      required:
        - updater_id
        - execution_host_id
        - transport_mode
        - agent_service_id
        - ownership_epoch
        - agent_ownership_epoch
        - source_policy_revision
        - projection_revision
        - local_executor_policy_revision
        - local_executor_policy_sha256
      description: Server-owned ssh_v1 execution-host ownership after atomic deactivation. agent_service_id is the preserved legacy updater; updater_id is the pull updater now reporting observer epoch zero. No credential or secret is returned.
      properties:
        updater_id:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
        execution_host_id:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,190}$"
        transport_mode:
          const: ssh_v1
        agent_service_id:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
        ownership_epoch:
          type: integer
          format: int64
          minimum: 1
        agent_ownership_epoch:
          type: integer
          format: int64
          const: 0
        source_policy_revision:
          type: integer
          format: int64
          minimum: 1
          description: Source pull-policy revision retained for observer operation and future reactivation.
        projection_revision:
          type: integer
          format: int64
          minimum: 1
        local_executor_policy_revision:
          type: integer
          format: int64
          minimum: 1
        local_executor_policy_sha256:
          type: string
          pattern: "^sha256:[a-f0-9]{64}$"
    HostSelfUpdateCreateRequest:
      type: object
      additionalProperties: false
      required: [target_version, idempotency_key]
      description: The host binding comes only from the path. Release commit, artifact, digest, location, and credentials are resolved by the server.
      properties:
        target_version:
          type: string
          minLength: 6
          maxLength: 128
          pattern: '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$'
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[^\u0000-\u001F\u007F]+$'
    HostSelfUpdateRetryRequest:
      type: object
      additionalProperties: false
      required: [idempotency_key]
      properties:
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[^\u0000-\u001F\u007F]+$'
    HostSelfUpdateCancelRequest:
      type: object
      additionalProperties: false
      required: [expected_revision]
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 1
    HostSelfUpdateRelease:
      type: object
      additionalProperties: false
      description: Verified immutable public release identity. No download location or credential is persisted or returned.
      required:
        - tag
        - commit
        - published_at
        - manifest_asset_id
        - manifest_asset_name
        - manifest_sha256
        - manifest_checksum_asset_id
        - manifest_checksum_sha256
        - archive_asset_id
        - archive_asset_name
        - archive_size
        - archive_sha256
        - archive_checksum_asset_id
        - archive_checksum_sha256
        - arch
        - agent_protocol_version
        - executor_protocol_version
        - mutation_protocol_version
        - recovery_protocol_version
        - minimum_panel_version
        - attestation_verified_at
      properties:
        tag:
          type: string
          minLength: 6
          maxLength: 128
          pattern: '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$'
        commit: {type: string, pattern: '^[a-f0-9]{40}$'}
        published_at: {type: string, format: date-time}
        manifest_asset_id: {type: integer, format: int64, minimum: 1}
        manifest_asset_name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[A-Za-z0-9][A-Za-z0-9._+-]{0,254}$'
        manifest_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        manifest_checksum_asset_id: {type: integer, format: int64, minimum: 1}
        manifest_checksum_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        archive_asset_id: {type: integer, format: int64, minimum: 1}
        archive_asset_name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[A-Za-z0-9][A-Za-z0-9._+-]{0,254}$'
        archive_size: {type: integer, format: int64, minimum: 1}
        archive_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        archive_checksum_asset_id: {type: integer, format: int64, minimum: 1}
        archive_checksum_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        arch: {enum: [amd64, arm64]}
        agent_protocol_version: {type: integer, minimum: 1}
        executor_protocol_version: {type: integer, minimum: 1}
        mutation_protocol_version: {type: integer, minimum: 1}
        recovery_protocol_version: {type: integer, minimum: 1}
        minimum_panel_version:
          type: string
          minLength: 6
          maxLength: 128
          pattern: '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$'
        attestation_verified_at: {type: string, format: date-time}
    HostSelfUpdate:
      type: object
      additionalProperties: false
      description: Dedicated lifecycle; it is never represented as a generic update job.
      required:
        - id
        - execution_host_id
        - agent_service_id
        - target_version
        - status
        - revision
        - idempotency_key
        - attempt_generation
        - expected_ownership_epoch
        - expected_source_policy_revision
        - expected_projection_revision
        - expected_local_executor_policy_revision
        - expected_local_executor_policy_sha256
        - previous_agent_version
        - previous_executor_version
        - previous_agent_protocol_version
        - previous_executor_protocol_version
        - previous_mutation_protocol_version
        - previous_recovery_protocol_version
        - release
        - issued_at
        - observation_state
        - created_at
        - updated_at
      properties:
        id: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
        execution_host_id: {type: string, minLength: 1, maxLength: 191, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,190}$'}
        agent_service_id: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
        target_version:
          type: string
          minLength: 6
          maxLength: 128
          pattern: '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$'
        status:
          enum: [queued, staging, activating, verifying, rolling_back, cancel_requested, succeeded, rolled_back, failed, canceled]
        revision: {type: integer, format: int64, minimum: 1}
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[^\u0000-\u001F\u007F]+$'
        requested_by:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[^\u0000-\u001F\u007F]+$'
        retry_of_id: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
        attempt_generation: {type: string, pattern: '^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$'}
        expected_ownership_epoch: {type: integer, format: int64, minimum: 1}
        expected_source_policy_revision: {type: integer, format: int64, minimum: 1}
        expected_projection_revision: {type: integer, format: int64, minimum: 1}
        expected_local_executor_policy_revision: {type: integer, format: int64, minimum: 1}
        expected_local_executor_policy_sha256: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        previous_agent_version: {type: string, minLength: 1, maxLength: 128, pattern: '^[^\u0000-\u001F\u007F]+$'}
        previous_executor_version: {type: string, minLength: 1, maxLength: 128, pattern: '^[^\u0000-\u001F\u007F]+$'}
        previous_agent_protocol_version: {type: integer, minimum: 1}
        previous_executor_protocol_version: {type: integer, minimum: 1}
        previous_mutation_protocol_version: {type: integer, minimum: 1}
        previous_recovery_protocol_version: {type: integer, minimum: 1}
        release: {$ref: "#/components/schemas/HostSelfUpdateRelease"}
        issued_at: {type: string, format: date-time}
        observation_state: {enum: [known, stalled, unknown]}
        reported_phase: {type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,63}$'}
        last_heartbeat_at: {type: string, format: date-time}
        stalled_since: {type: string, format: date-time}
        cancel_requested_at: {type: string, format: date-time}
        started_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
        code: {type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,63}$'}
        message: {type: string, minLength: 1, maxLength: 255, pattern: '^[^\u0000-\u001F\u007F]+$'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    HostSelfUpdateListResponse:
      type: object
      additionalProperties: false
      required: [self_updates]
      properties:
        self_updates:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/HostSelfUpdate"
    HostSelfUpdateGrant:
      $ref: "../schemas/host-self-update-grant.schema.json"
    HostSelfUpdateGrantIssueRequest:
      type: object
      additionalProperties: false
      required: [expected_revision, operation, plan_sha256, session_id]
      properties:
        expected_revision: {type: integer, format: int64, minimum: 1}
        operation: {enum: [stage, reconcile]}
        plan_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        session_id: {type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{15,127}$'}
    HostSelfUpdateGrantIssueResponse:
      $ref: "../schemas/host-self-update-grant-issue-response.schema.json"
    HostSelfUpdateGrantConsumeRequest:
      $ref: "../schemas/host-self-update-grant-consume-request.schema.json"
    HostSelfUpdateGrantConsumeResponse:
      $ref: "../schemas/host-self-update-grant-consume-response.schema.json"
    SystemUpdateCreateRequest:
      type: object
      additionalProperties: false
      required: [target_id, idempotency_key]
      allOf:
        - if:
            required: [operation]
            properties:
              operation: {const: port_reconfigure}
          then:
            required: [operation, expected_endpoint_revision]
            not:
              required: [strategy]
            oneOf:
              - required: [new_port]
                not:
                  anyOf:
                    - required: [new_advertised_port]
                    - required: [new_published_port]
                    - required: [new_container_port]
              - required: [new_advertised_port, new_published_port, new_container_port]
                not:
                  required: [new_port]
          else:
            required: [strategy]
            not:
              anyOf:
                - required: [new_port]
                - required: [new_advertised_port]
                - required: [new_published_port]
                - required: [new_container_port]
                - required: [expected_endpoint_revision]
      properties:
        operation:
          type: string
          enum: [software_update, port_reconfigure]
          default: software_update
        target_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
        strategy:
          type: string
          enum: [when_idle, maintenance]
        new_port: {type: integer, minimum: 1024, maximum: 65535}
        new_advertised_port: {type: integer, minimum: 1, maximum: 65535}
        new_published_port: {type: integer, minimum: 1024, maximum: 65535}
        new_container_port: {type: integer, minimum: 1024, maximum: 65535}
        expected_endpoint_revision: {type: integer, format: int64, minimum: 1}
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[^\u0000-\u001F\u007F]+$'
    SystemUpdatePortMapping:
      type: object
      additionalProperties: false
      required: [mode, state]
      allOf:
        - if:
            required: [state]
            properties:
              state: {const: applied}
          then:
            required:
              - advertised_port
              - published_port
              - container_port
              - health_port
              - config_revision
              - published_host_ip
              - reported_at
      properties:
        mode: {type: string, const: docker}
        state:
          type: string
          enum: [applied, drifted, unavailable]
        advertised_port: {type: integer, minimum: 1, maximum: 65535}
        published_port: {type: integer, minimum: 1024, maximum: 65535}
        container_port: {type: integer, minimum: 1024, maximum: 65535}
        health_port: {type: integer, minimum: 1024, maximum: 65535}
        config_revision: {type: integer, format: int64, minimum: 1}
        published_host_ip: {type: string, const: 127.0.0.1}
        reported_at: {type: string, format: date-time}
    SystemUpdateTarget:
      type: object
      additionalProperties: false
      required: [target_id, target_type, name, update_available, updater_online, eligible, busy]
      properties:
