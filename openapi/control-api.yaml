        "400":
          description: invalid_host_agent_policy_request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: missing or invalid service token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: token does not own service_id or lacks service.config.read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: host-agent transport binding mismatch or client revision is ahead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /services/host-agent/self-updates/{id}/grants:
    post:
      operationId: issueHostSelfUpdateGrant
      security:
        - bearerToken: []
      description: Issues one short-lived single-logical-consume credential to the authenticated Host Agent for one exact self-update attempt, lifecycle revision, host/agent ownership and policy fence, release identity, protocol set, directive time, plan hash, session, and stage or reconcile operation. Generic update-job grants are not reusable here.
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostSelfUpdateGrantIssueRequest"
      responses:
        "201":
          description: first issuance returns the transient credential; an idempotent replay returns only the same non-secret receipt with issued=false
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always no-store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostSelfUpdateGrantIssueResponse"
        "400":
          description: invalid_host_self_update_grant_request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: missing or invalid Host Agent service token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: service token does not own the bound Host Agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: host_self_update_not_found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: lifecycle revision, ownership, policy, plan, operation, expiry, or active-host fence conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /services/host-agent/self-update-grants/consume:
    post:
      operationId: consumeHostSelfUpdateGrant
      security: []
      description: The root-owned Local Executor consumes the transient credential against the exact complete grant binding and fixed Control Panel origin. The credential is the authorization proof and must not enter argv, environment, logs, or persistent state. Repeating the same credential and exact binding after response loss returns consumed=false with the same receipt; any changed binding fails closed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostSelfUpdateGrantConsumeRequest"
      responses:
        "200":
          description: grant consumed now, or exact response-loss replay reconciled
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always no-store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostSelfUpdateGrantConsumeResponse"
        "400":
          description: invalid_host_self_update_grant_consume
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: host_self_update_grant_expired, host_self_update_grant_consumed, or exact binding/fence mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /services/runtime-config:
    get:
      security:
        - bearerToken: []
      description: Service-token endpoint for a registered service to fetch only its own assignments and Control Panel-managed non-secret runtime profiles. Requires service.config.read.
      parameters:
        - name: service_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: runtime config for the authenticated service
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always no-store because runtime config includes assignments and runtime secret reference names.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRuntimeConfig"
        "403":
          description: token does not own the requested service_id or lacks service.config.read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /services/runtime-secrets/resolve:
    post:
      security:
        - bearerToken: []
      description: Service-token endpoint for resolving a short-lived raw runtime secret that is explicitly referenced by the authenticated service runtime config or an assigned stream archive runtime config. Requires service.secret.resolve. A server-side lease prevents the same service/context/secret from being resolved repeatedly during the returned expires_in_sec window. This endpoint is not for browser UI use and responses must not be cached, logged, audited with raw values, or exposed to the frontend.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceRuntimeSecretResolveRequest"
      responses:
        "200":
          description: one-time runtime secret for the authenticated service
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always no-store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRuntimeSecretResolveResponse"
        "403":
          description: token does not own service_id, lacks service.secret.resolve, or secret_name is not referenced by that service runtime config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: service or configured secret was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: runtime secret lease is still active for the same service/context/secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /services/notifications/email:
    post:
      summary: Send a notification email with global SMTP
      operationId: sendServiceNotificationEmail
      security:
        - bearerToken: []
      description: Delivers a required plain-text notification and an optional HTML alternative with the globally managed application SMTP settings. This service endpoint requires the dedicated notifications.email.send scope, a registered non-pending service owned by the token, and service_type=observability. SMTP configuration and credentials are loaded only inside Control Panel and are never copied into notification channels, runtime config, responses, audit metadata, or logs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceNotificationEmailRequest"
      responses:
        "202":
          description: the configured SMTP server accepted the message delivery attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceNotificationEmailResponse"
        "400":
          description: bad_request or invalid_email_notification; recipients, subject, text, or optional HTML violated the size, bare-mailbox, or control-character contract
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: missing_service_token or invalid_service_token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: missing_service_scope, service_type_not_allowed, or service_token_not_registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: smtp_not_configured or smtp_requires_tls
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: rate_limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: list_services_failed or app_settings_failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: smtp_dial_failed, smtp_starttls_failed, smtp_auth_failed, smtp_from_rejected, smtp_recipient_rejected, smtp_data_failed, smtp_write_failed, smtp_close_failed, or send_failed; the response never includes raw SMTP failure details, credentials, or recipient addresses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: secret_encryption_key_required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /services/heartbeat:
    post:
      security:
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Heartbeat"
      responses:
        "202":
          description: heartbeat accepted
  /services/update-jobs/claim:
    post:
      security:
        - bearerToken: []
      description: Atomically claims the next eligible job assigned to the authenticated update_agent and optional host_id execution slot. Requires updates.claim. host_id is required for central multi-host operation and may be omitted only by legacy per-host agents. If active_job_id is present, the server returns only that job's renewed lease or an explicit clear_active_job_id instruction and never claims a different job. The opaque lease token is returned once and must not be logged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAgentClaimRequest"
      responses:
        "200":
          description: job claimed or renewed with a time-bounded lease, or the reported active job must be durably cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateAgentClaimResponse"
        "204":
          description: active_job_id was omitted and no eligible job is currently available
        "403":
          description: token is not bound to the requested update_agent or lacks updates.claim
  /services/update-jobs/{id}/report:
    post:
      security:
        - bearerToken: []
      description: Idempotently reports monotonic progress for the claimed job. Requires updates.report and the active lease. Arbitrary logs and secrets are rejected or sanitized.
      parameters: [{$ref: "#/components/parameters/id"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAgentReportRequest"
      responses:
        "200":
          description: progress accepted and lease renewed when applicable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemUpdateJob"
        "409":
          description: lease expired, sequence regressed, or state transition is invalid
  /services/update-jobs/{id}/authorize:
    post:
      security:
        - bearerToken: []
      deprecated: true
      description: Permanently disabled legacy per-host mutation authorization endpoint. Central Updater must use the short-lived mutation-grant issue and consume endpoints. Authenticated callers with updates.authorize always receive 410 and no mutation is authorized.
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "401":
          description: missing or invalid service token
        "403":
          description: token lacks updates.authorize
        "410":
          description: legacy_system_update_authorization_disabled; use mutation grants
  /services/update-jobs/{id}/mutation-grants:
    post:
      security:
        - bearerToken: []
      description: Issues a short-lived one-time mutation grant for the destination helper after validating the authenticated update_agent, updates.authorize scope, active lease, execution host, target, version, deployment mode, operation, immutable plan hash, and remote session. The job identity is taken only from the id path parameter. Connection and privileged execution configuration remain server-side.
      parameters: [{$ref: "#/components/parameters/id"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAgentMutationGrantIssueRequest"
      responses:
        "201":
          description: one-time mutation grant issued for the exact immutable binding
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always no-store because the response contains a one-time grant credential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateAgentMutationGrantIssueResponse"
        "400":
          description: bad_request or invalid_system_update_mutation_grant
        "401":
          description: missing or invalid service token
        "403":
          description: token lacks updates.authorize or is not bound to service_id
        "404":
          description: system_update_job_not_found
        "409":
          description: mutation grant state, lease, host, target, version, mode, operation, plan hash, or session binding does not match
  /services/update-jobs/{id}/mutation-grants/consume:
    post:
      security:
        - bearerToken: []
      description: Consumes the mutation grant supplied as the Bearer credential against the exact job path and immutable host, target, version, deployment mode, operation, plan hash, lease generation, and session binding. The first matching use and an idempotent replay of the same token, session, and binding return 204; any different reuse returns 409. The grant token is never accepted in the JSON body.
      parameters: [{$ref: "#/components/parameters/id"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAgentMutationGrantConsumeRequest"
      responses:
        "204":
          description: grant consumed, or the exact same grant, session, and binding was already consumed; response has no body
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always no-store.
        "400":
          description: bad_request or invalid_system_update_mutation_grant_consumption
        "401":
          description: mutation grant Bearer credential is missing or malformed
        "409":
          description: mutation grant is unknown, expired, no longer bound to the current job lease, or was reused with a different job, session, or binding
  /services/observability/signals:
    post:
      security:
        - bearerToken: []
      description: Worker and Encoder/Recorder report Observability signals through Control Panel with a Node Runtime Token. Requires observability.ingest. Control Panel overwrites service_id and service_type from the registered service before forwarding to Observability.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceObservabilitySignal"
      responses:
        "202":
          description: signal accepted for forwarding
        "400":
          description: invalid signal payload
        "401":
          description: missing or invalid service token
        "403":
          description: wrong service type, pending service, or missing observability.ingest scope
        "502":
          description: Observability API is unavailable or rejected the forwarded signal
  /services/stream-events:
    post:
      security:
        - bearerToken: []
      responses:
        "202":
          description: service stream event accepted
  /services/stream-artifacts:
    post:
      security:
        - bearerToken: []
      description: Assigned Encoder/Recorder reports logical archive artifacts. Requires encoder.status.write.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceArtifactReport"
      responses:
        "202":
          description: artifact report accepted
        "400":
          description: invalid artifact metadata or unsafe relative path
        "403":
          description: wrong service type, missing scope, or service is not assigned to the stream
        "404":
          description: service_or_stream_not_found, service_not_registered, or stream_not_found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: stream_artifact_store_failed; a non-transient persistence failure prevented the artifact report from being stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: stream_artifact_store_unavailable; a transient database connection failure prevented the artifact report from being stored and the caller may retry
          headers:
            Retry-After:
              description: Number of seconds the caller should wait before retrying the artifact report.
              schema:
                type: integer
                minimum: 1
              example: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /services/streams/{id}/start:
    post:
      security:
        - bearerToken: []
      description: Starts a waiting stream from its primary assigned Discord Bot after a configured Discord voice-channel join. Requires streams.start. The authenticated service token must be discord_bot, be registered as the stream's primary Discord Bot, and match the saved Discord configuration; request data cannot override the saved stream settings.
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: stream start lifecycle accepted or completed
        "401":
          description: missing or invalid service token
        "403":
          description: missing streams.start scope, non-Discord service, or token is not the primary assigned Discord Bot
        "409":
          description: stream is not configured for Discord VC auto-start or is not currently startable
  /services/streams/{id}/stop:
    post:
      security:
        - bearerToken: []
      description: Stops an active Discord VC-triggered stream after its primary assigned Discord Bot observes that the configured voice channel is empty. Requires streams.stop. The authenticated service token must be the stream's primary Discord Bot; request data cannot override the saved stream settings. completed and stopping streams are idempotent successes.
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: stream stopped, or already stopped
        "202":
          description: stop is already in progress
        "401":
          description: missing or invalid service token
        "403":
          description: missing streams.stop scope, non-Discord service, or token is not the primary assigned Discord Bot
        "409":
          description: stream is not configured for Discord VC auto-stop or is not currently stoppable
  /services/remediation-actions/execute:
    post:
      security:
        - bearerToken: []
      description: Observability requests an approved remediation dispatch. Requires remediation.execute. action_id, incident_id, and stream_id are required correlation context. Control Panel verifies the context against Observability read API and rejects duplicate action_id replays before service dispatch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceRemediationExecuteRequest"
      responses:
        "202":
          description: remediation dispatch accepted
        "400":
          description: missing action_id, incident_id, stream_id, or unsupported action
        "403":
          description: wrong service type, missing remediation scope, or remediation context not verified
        "409":
          description: duplicate action_id replay or missing stream assignment
