        session_idle_timeout_min:
          type: integer
          minimum: 5
        session_absolute_lifetime_h:
          type: integer
          minimum: 1
        remember_me_enabled:
          type: boolean
          const: false
        mfa_mode:
          enum: [disabled, totp, passkey]
        mfa_required_roles:
          type: array
          description: Empty means an enabled mfa_mode applies to all users. Otherwise only users with one of these roles must complete that MFA policy.
          items:
            type: string
        mfa_supported_methods:
          type: array
          readOnly: true
          items:
            enum: [totp, passkey]
        passkey_status:
          enum: [planned, credential_store_ready, available]
          readOnly: true
          description: available means WebAuthn registration, passwordless login, and passkey-required login policy are available.
        updated_at:
          type: string
          format: date-time
    EncoderOutputRelayMode:
      type: string
      enum: [direct, legacy_stream_key, live_api_static, static]
      description: >
        Non-secret Encoder/Recorder output relay routing vocabulary. New Encoder reports use the
        canonical direct, legacy_stream_key, or live_api_static values. direct has no fixed output relay;
        legacy_stream_key means a fixed relay uses a preconfigured legacy YouTube stream-key route; and
        live_api_static means a fixed relay accepts the non-secret live API static binding. The historical
        static value is accepted on Control Panel capability input and registered-service reads for migration
        compatibility with legacy_stream_key semantics. Unknown values are rejected fail closed. This value
        never carries an RTMPS URL, relay URL, or stream key.
    EncoderOutputRelayCapabilities:
      type: object
      additionalProperties: true
      description: Non-secret service capability hints for output relay routing and negotiated Worker scene-video transport.
      allOf:
        - if:
            required: [output_relay_mode]
            properties:
              output_relay_mode: {const: live_api_static}
          then:
            required: [output_relay_binding_id]
      properties:
        output_relay_mode:
          $ref: "#/components/schemas/EncoderOutputRelayMode"
        output_relay_binding_id:
          type: string
          pattern: "^relay-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          description: Required with live_api_static. Non-secret fixed relay binding identity that must match the selected live_api_relay_static output; never an RTMPS address or stream key.
        scene_frames_mjpeg_srt:
          type: boolean
          const: true
          description: Worker can render the complete scene as low-rate MJPEG images over the negotiated job-scoped SRT ingest without video encoding.
        worker_frame_ingest_mjpeg_srt:
          type: boolean
          const: true
          description: Encoder/Recorder can receive Worker-rendered JPEG images, hold the latest frame, and perform the only video encode and audio mux.
        scene_video_srt:
          type: boolean
          const: true
          deprecated: true
          description: Legacy Worker H.264 MPEG-TS capability accepted for migration reads only.
        worker_video_ingest_srt:
          type: boolean
          const: true
          deprecated: true
          description: Legacy Encoder H.264 MPEG-TS capability accepted for migration reads only.
    ServiceRegistrationRequest:
      type: object
      additionalProperties: false
      required: [service_id, service_type, service_name, version, capabilities]
      allOf:
        - if:
            required: [transport_mode]
          then:
            properties:
              service_type:
                const: update_agent
        - if:
            required: [service_type, transport_mode]
            properties:
              service_type:
                const: update_agent
              transport_mode:
                const: pull_v2
          then:
            not:
              anyOf:
                - required: [host]
                - required: [port]
                - required: [public_url]
          else:
            required: [public_url]
      properties:
        service_id:
          type: string
          minLength: 1
        service_type:
          enum: [discord_bot, encoder_recorder, worker, observability, update_agent]
        transport_mode:
          enum: [ssh_v1, pull_v2]
          default: ssh_v1
          description: Existing payloads that omit transport_mode are interpreted as ssh_v1. An update_agent with transport_mode pull_v2 must omit host, port, and public_url. Server-owned execution_host_id and ownership_epoch are never accepted from registration input.
        service_name:
          type: string
          minLength: 1
        description:
          type: string
        host:
          type: string
        port:
          type: integer
          minimum: 0
          maximum: 65535
        ssl_enabled:
          type: boolean
        public_url:
          type: string
          format: uri
          pattern: "^https?://"
          description: Control Panel から到達可能な http/https absolute URL。
        version:
          type: string
        commit:
          type: string
        build_date:
          type: string
        capabilities:
          $ref: "#/components/schemas/EncoderOutputRelayCapabilities"
        hostname:
          type: string
        os:
          type: string
        arch:
          type: string
    Heartbeat:
      type: object
      additionalProperties: false
      required: [service_id, status]
      properties:
        service_id: {type: string, minLength: 1}
        node_id: {type: string, minLength: 1}
        nodeId: {type: string, minLength: 1}
        current_stream_id: {type: string}
        status:
          type: string
          enum: [unknown, online, updating, degraded, offline, ready, running, stopping, failed]
        metrics:
          type: object
          additionalProperties: {type: number}
        version: {type: string}
        commit: {type: string}
        build_date: {type: string}
        hostname: {type: string}
        os: {type: string}
        arch: {type: string}
        capabilities:
          $ref: "#/components/schemas/EncoderOutputRelayCapabilities"
        api:
          type: object
          additionalProperties: false
          required: [host, port, sslEnabled]
          properties:
            host: {type: string, minLength: 1}
            port: {type: integer, minimum: 1, maximum: 65535}
            sslEnabled: {type: boolean}
        timestamp: {type: string, format: date-time}
    HostAgentPolicyRequest:
      type: object
      additionalProperties: false
      required: [service_id, current_revision]
      description: Server-owned transport, execution_host_id, and ownership_epoch fields are never accepted from this request.
      properties:
        service_id:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
        current_revision:
          type: integer
          minimum: 0
    HostAgentPolicyTarget:
      type: object
      additionalProperties: false
      required: [service_id, service_type, deployment_mode]
      properties:
        service_id:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
        service_type:
          enum: [control_panel, worker, encoder_recorder, discord_bot, observability]
        deployment_mode:
          enum: [systemd, docker]
        desired_endpoint:
          $ref: "#/components/schemas/ServiceEndpoint"
        applied_endpoint:
          $ref: "#/components/schemas/ServiceEndpoint"
        local_listen_endpoint:
          $ref: "#/components/schemas/ServiceEndpoint"
        local_health_endpoint:
          $ref: "#/components/schemas/ServiceEndpoint"
        applied_config_revision:
          type: integer
          format: int64
          minimum: 1
        applied_config_sha256:
          type: string
          pattern: "^sha256:[a-f0-9]{64}$"
    HostAgentPolicyResponse:
      type: object
      additionalProperties: false
      required: [service_id, transport_mode, execution_host_id, ownership_epoch, revision, source_policy_revision, local_executor_policy_revision, observe_only, targets]
      allOf:
        - if:
            properties:
              ownership_epoch: {const: 0}
          then:
            properties:
              observe_only: {const: true}
          else:
            properties:
              observe_only: {const: false}
        - if:
            properties:
              ownership_epoch: {const: 0}
          then:
            oneOf:
              - properties:
                  local_executor_policy_revision: {const: 0}
                not:
                  required: [local_executor_policy_sha256]
              - required: [local_executor_policy_sha256]
                properties:
                  local_executor_policy_revision: {minimum: 1}
          else:
            required: [local_executor_policy_sha256]
            properties:
              local_executor_policy_revision: {minimum: 1}
        - if:
            required: [self_update_status]
          then:
            required: [self_update_id, self_update_revision, self_update_status]
            allOf:
              - if:
                  required: [self_update_status]
                  properties:
                    self_update_status: {const: cancel_requested}
                then:
                  not:
                    anyOf:
                      - required: [runtime_requirement]
                      - required: [self_update]
                else:
                  required: [runtime_requirement, self_update]
          else:
            not:
              anyOf:
                - required: [self_update_id]
                - required: [self_update_revision]
                - required: [runtime_requirement]
                - required: [self_update]
        - if:
            anyOf:
              - required: [self_update_id]
              - required: [self_update_revision]
              - required: [runtime_requirement]
              - required: [self_update]
          then:
            required: [self_update_status]
      properties:
        service_id:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
        transport_mode:
          const: pull_v2
          description: Server-owned transport binding.
        execution_host_id:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,190}$"
          description: Server-owned execution-host binding.
        ownership_epoch:
          type: integer
          minimum: 0
          description: Server-owned monotonic fencing epoch. Zero is the observe-only, not-yet-owned sentinel and is never valid for mutation.
        revision:
          type: integer
          minimum: 1
          description: Projection cursor for this host-agent policy.
        source_policy_revision:
          type: integer
          format: int64
          minimum: 1
        local_executor_policy_revision:
          type: integer
          format: int64
          minimum: 0
          description: Zero is allowed only for an observe-only epoch-zero policy with no policy digest.
        local_executor_policy_sha256:
          type: string
          pattern: "^sha256:[a-f0-9]{64}$"
        observe_only:
          type: boolean
        targets:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/HostAgentPolicyTarget"
        self_update_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
        self_update_revision:
          type: integer
          format: int64
          minimum: 1
        self_update_status:
          enum: [queued, staging, activating, verifying, rolling_back, cancel_requested]
        runtime_requirement:
          $ref: "#/components/schemas/HostAgentRuntimeRequirement"
        self_update:
          $ref: "#/components/schemas/HostAgentSelfUpdateDirective"
    HostAgentRuntimeRequirement:
      type: object
      additionalProperties: false
      required: [minimum_agent_version, minimum_executor_version, agent_protocol_version, executor_protocol_version, mutation_protocol_version, recovery_protocol_version]
      properties:
        minimum_agent_version:
          type: string
          minLength: 6
          maxLength: 128
          pattern: '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$'
        minimum_executor_version:
          type: string
          minLength: 6
          maxLength: 128
          pattern: '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$'
        agent_protocol_version: {type: integer, minimum: 1}
        executor_protocol_version: {type: integer, minimum: 1}
        mutation_protocol_version: {type: integer, minimum: 1}
        recovery_protocol_version: {type: integer, minimum: 1}
    HostAgentSelfUpdateDirective:
      $ref: "../schemas/host-agent-self-update-directive.schema.json"
    HostSelfUpdateReleaseBinding:
      $ref: "../schemas/host-self-update-release-binding.schema.json"
    ServiceEndpoint:
      type: object
      additionalProperties: false
      required: [host, port, ssl_enabled, public_url]
      properties:
        host:
          type: string
          minLength: 1
        port:
          type: integer
          minimum: 1
          maximum: 65535
        ssl_enabled:
          type: boolean
        public_url:
          type: string
          format: uri
          pattern: "^https?://"
    RegisteredService:
      type: object
      required: [service_id, service_type, service_name, ssl_enabled, version, status, capabilities, created_at, updated_at]
      allOf:
        - if:
            anyOf:
              - required: [transport_mode]
              - required: [execution_host_id]
              - required: [ownership_epoch]
          then:
            properties:
              service_type:
                const: update_agent
        - if:
            required: [service_type, transport_mode]
            properties:
              service_type:
                const: update_agent
              transport_mode:
                const: pull_v2
          then:
            required: [execution_host_id, ownership_epoch]
            not:
              anyOf:
                - required: [host]
                - required: [port]
                - required: [public_url]
                - required: [desired_endpoint]
                - required: [applied_endpoint]
                - required: [reported_endpoint]
                - required: [endpoint_revision]
                - required: [endpoint_status]
                - required: [applied_config_revision]
                - required: [applied_config_sha256]
          else:
            required: [public_url]
      properties:
        ssl_enabled:
          type: boolean
        description:
          type: string
        host:
          type: string
        port:
          type: integer
          minimum: 0
          maximum: 65535
        reported_version:
          type: string
        reported_commit:
          type: string
        reported_build_date:
          type: string
        last_reported_at:
          type: string
          format: date-time
          nullable: true
        reported_hostname:
          type: string
        reported_os:
          type: string
        reported_arch:
          type: string
        reported_capabilities:
          $ref: "#/components/schemas/EncoderOutputRelayCapabilities"
        service_id:
          type: string
        service_type:
          enum: [discord_bot, encoder_recorder, worker, observability, update_agent]
        transport_mode:
          enum: [ssh_v1, pull_v2]
          default: ssh_v1
          description: Existing payloads that omit transport_mode are interpreted as ssh_v1. An update_agent with transport_mode pull_v2 must omit host, port, and public_url.
        execution_host_id:
          type: string
          minLength: 1
          maxLength: 191
          pattern: "^[^\\x00-\\x1F\\x7F]+$"
          description: Stable execution-host identity owned by a pull_v2 update agent.
        ownership_epoch:
          type: integer
          minimum: 0
          description: Server-owned execution-host ownership epoch. Zero is the observe-only, not-yet-owned sentinel.
        service_name:
          type: string
        public_url:
          type: string
          format: uri
          pattern: "^https?://"
        desired_endpoint:
          $ref: "#/components/schemas/ServiceEndpoint"
        applied_endpoint:
          $ref: "#/components/schemas/ServiceEndpoint"
        reported_endpoint:
          $ref: "#/components/schemas/ServiceEndpoint"
        endpoint_revision:
          type: integer
          minimum: 1
        endpoint_status:
          type: string
          minLength: 1
          maxLength: 32
        applied_config_revision:
          type: integer
          format: int64
          minimum: 1
        applied_config_sha256:
          type: string
          pattern: "^sha256:[a-f0-9]{64}$"
        version:
          type: string
        status:
          enum: [unknown, pending, registered, assigned, online, updating, offline, degraded, starting, stopping, restart_requested]
        assignment_role:
          enum: [primary, standby]
          description: present only when returned as a stream assignment. Only primary services receive dispatch; standby services are failover candidates and cannot resolve stream-scoped runtime secrets until promoted.
        last_heartbeat_at:
          type: string
          format: date-time
          nullable: true
        current_stream_id:
          type: string
          nullable: true
        capabilities:
          $ref: "#/components/schemas/EncoderOutputRelayCapabilities"
        metrics:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ServiceTokenCreateRequest:
      type: object
      additionalProperties: false
      required: [service_type, scopes]
      properties:
        service_type:
          enum: [discord_bot, encoder_recorder, worker, observability, update_agent]
        scopes:
          type: array
          items:
            enum:
              - service.register
              - service.heartbeat
              - service.logs.write
              - service.status.write
              - service.config.read
              - service.secret.resolve
              - worker.events.write
              - encoder.status.write
              - discord.status.write
              - streams.start
              - streams.stop
              - observability.ingest
              - notifications.email.send
              - remediation.execute
              - updates.claim
              - updates.report
              - updates.authorize
          uniqueItems: true
        service_id:
          type: string
          description: Optional service ID to pre-create as a pending registry entry. Requires service.register scope.
        service_name:
          type: string
        public_url:
          type: string
          format: uri
          pattern: "^https?://"
        version:
          type: string
        capabilities:
          $ref: "#/components/schemas/EncoderOutputRelayCapabilities"
          description: Non-secret capability hints. Secret-like keys and values are redacted before persistence.
    ServiceToken:
      type: object
      required: [id, service_type, scopes, created_at]
      properties:
        id:
          type: string
        service_type:
          enum: [discord_bot, encoder_recorder, worker, observability, update_agent]
        scopes:
          type: array
          items:
            enum:
              - service.register
              - service.heartbeat
              - service.logs.write
              - service.status.write
              - service.config.read
              - service.secret.resolve
              - worker.events.write
              - encoder.status.write
              - discord.status.write
              - streams.start
              - streams.stop
              - observability.ingest
              - notifications.email.send
              - remediation.execute
              - updates.claim
              - updates.report
              - updates.authorize
        revoked_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        token:
          type: string
          description: One-time raw token returned only on create or rotate responses. Never returned by list endpoints.
    ServiceObservabilitySignal:
      type: object
      additionalProperties: true
      required: [type, name]
      properties:
        type:
          enum: [event, metric]
        name:
          type: string
          minLength: 1
        stream_id:
          type: string
        status:
          type: string
        value:
          type: number
        attributes:
          type: object
          additionalProperties: true
        timestamp:
          type: string
          format: date-time
      description: service_id and service_type, if supplied by the caller, are ignored and replaced with the authenticated registered service identity.
    DiagnosticRerunResponse:
      $ref: "../schemas/diagnostic-rerun-response.schema.json"
    ServiceRemediationExecuteRequest:
      type: object
      additionalProperties: false
      required: [action_id, action, incident_id, stream_id]
      properties:
        action_id:
          type: string
          minLength: 1
          description: Remediation action ID created by Observability. Must be unique for each dispatch attempt.
        action:
          enum: [retry_gdrive_upload, retry_package_remux]
        incident_id:
          type: string
          minLength: 1
          description: Incident ID associated with the remediation action.
        stream_id:
          type: string
          minLength: 1
          description: Stream ID from the incident context.
    StreamServiceAssignment:
      type: object
      description: Stream assignment returned to the authenticated service only. Primary services receive dispatch; standby services are failover candidates and cannot resolve stream-scoped secrets until promoted.
      required: [stream_id, service_id, service_type, assignment_role, assigned_at]
      properties:
        stream_id:
          type: string
        service_id:
          type: string
        service_type:
          enum: [discord_bot, encoder_recorder, worker, observability]
        assignment_role:
          enum: [primary, standby]
        assigned_at:
          type: string
          format: date-time
    ServiceAssignmentWriteRequest:
      type: object
      additionalProperties: false
      required: [stream_id]
      properties:
        stream_id:
          type: string
          minLength: 1
        assignment_role:
          type: string
          enum: [primary, standby]
          default: primary
          description: primary is dispatched on stream start; standby is registered as a failover candidate but is not started automatically.
    DiscordConfig:
      type: object
      additionalProperties: false
      required: [id, name, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        service_id:
          type: string
          description: Discord Bot service allowed to receive this config through runtime config.
        guild_id:
          type: string
        voice_channel_id:
          type: string
        text_channel_id:
          type: string
        bot_token_configured:
          type: boolean
        bot_token_fingerprint:
          type: string
        caption_enabled:
          type: boolean
        stt_profile_id:
          type: string
        reconnect_enabled:
          type: boolean
        reconnect_max_attempts:
          type: integer
          minimum: 1
        reconnect_base_delay:
          type: string
          description: Go duration string for the initial voice rejoin backoff, for example 2s.
        reconnect_max_delay:
          type: string
          description: Go duration string for the maximum voice rejoin backoff, for example 30s.
        audio_forward_enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DiscordConfigWriteRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        service_id:
          type: string
        guild_id:
          type: string
        voice_channel_id:
          type: string
        text_channel_id:
          type: string
        bot_token:
          type: string
          writeOnly: true
          description: Write-only Discord Bot token. Never returned by Control API, UI, logs, or audit metadata.
        caption_enabled:
          type: boolean
        stt_profile_id:
          type: string
        reconnect_enabled:
          type: boolean
        reconnect_max_attempts:
          type: integer
          minimum: 1
        reconnect_base_delay:
          type: string
          description: Go duration string for the initial voice rejoin backoff, for example 2s.
        reconnect_max_delay:
          type: string
          description: Go duration string for the maximum voice rejoin backoff, for example 30s.
        audio_forward_enabled:
          type: boolean
    YouTubeOutput:
      type: object
      additionalProperties: false
      required: [id, name, mode, created_at, updated_at]
      allOf:
        - if:
            properties:
              mode: {const: live_api_relay_static}
            required: [mode]
          then:
            not:
              anyOf:
                - required: [rtmp_url]
                - required: [stream_key_configured]
                - required: [stream_key_fingerprint]
                - required: [watch_url]
      properties:
        id:
          type: string
        name:
          type: string
        mode:
          type: string
          enum: [stream_key, live_api_dry_run, live_api, live_api_relay_static]
        rtmp_url:
          type: string
          pattern: "^rtmps://"
          description: Returned without the stream key. Runtime stream keys are delivered only to the assigned Encoder/Recorder.
        stream_key_configured:
          type: boolean
        stream_key_fingerprint:
          type: string
        watch_url:
          type: string
          format: uri
          pattern: "^https://www\\.youtube\\.com/watch\\?v=[A-Za-z0-9_-]{6,32}$"
          description: Canonical public watch URL used by stream_key outputs. It contains no stream key or OAuth credential.
        oauth_account_id:
          type: string
        relay_binding_id:
          type: string
          pattern: "^relay-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          description: Non-secret fixed Encoder/Recorder relay binding identity for live_api_relay_static. It is never an RTMPS URL or stream key.
        reusable_live_stream_id:
          type: string
          description: Non-secret reusable YouTube LiveStream identity for live_api_relay_static. Ingestion addresses and stream keys are never returned.
        broadcast_title_template:
          type: string
        broadcast_description:
          type: string
        privacy_status:
          type: string
          enum: [private, unlisted, public]
        latency_preference:
          type: string
          enum: [normal, low, ultra_low]
        enable_auto_start:
          type: boolean
        enable_auto_stop:
          type: boolean
        complete_on_stop:
          type: boolean
          description: When true, Control Panel completes the YouTube Live broadcast during normal stream stop.
        complete_retry_count:
          type: integer
          minimum: 0
          description: Number of failed YouTube Live API complete attempts retained for automatic backoff retry.
        complete_next_retry_at:
          type: string
          format: date-time
          description: Next automatic YouTube Live API complete retry time, when a retained runtime is waiting for retry.
        complete_last_error:
          type: string
          description: Safe error code from the latest YouTube Live API complete failure. Raw OAuth or stream key material must not be included.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    YouTubeOutputWriteRequest:
      type: object
      additionalProperties: false
      required: [name, mode]
      oneOf:
        - required: [name, mode]
          properties:
            mode:
              enum: [stream_key]
        - required: [name, mode, oauth_account_id]
          properties:
            mode:
              enum: [live_api_dry_run, live_api]
        - required: [name, mode, oauth_account_id, relay_binding_id, reusable_live_stream_id]
          properties:
            mode:
              enum: [live_api_relay_static]
          not:
            anyOf:
              - required: [rtmp_url]
              - required: [stream_key]
              - required: [watch_url]
      properties:
        name:
          type: string
          minLength: 1
        mode:
          type: string
          enum: [stream_key, live_api_dry_run, live_api, live_api_relay_static]
        rtmp_url:
          type: string
          pattern: "^rtmps://"
        stream_key:
          type: string
          writeOnly: true
          description: Write-only secret. Required when creating stream_key outputs, optional on update to keep the existing encrypted key. Never returned by Control API, UI, logs, or audit metadata.
        watch_url:
          type: string
          format: uri
          description: YouTube watch or share URL for stream_key mode. The server validates supported YouTube hosts and video IDs, rejects credentials, fragments, and non-default ports, then stores a canonical watch URL. New UI-created profiles require it; existing API profiles without this field remain compatible.
        oauth_account_id:
          type: string
          minLength: 1
          description: Required for live_api, live_api_dry_run, and live_api_relay_static modes.
        relay_binding_id:
          type: string
          pattern: "^relay-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          description: Required for live_api_relay_static. Non-secret fixed Encoder/Recorder relay binding identity; never an RTMPS URL or stream key.
        reusable_live_stream_id:
          type: string
          minLength: 1
          description: Required for live_api_relay_static. Non-secret reusable YouTube LiveStream identity; ingestion details and stream keys are not accepted.
        broadcast_title_template:
          type: string
        broadcast_description:
          type: string
        privacy_status:
          type: string
          enum: [private, unlisted, public]
        latency_preference:
          type: string
          enum: [normal, low, ultra_low]
        enable_auto_start:
          type: boolean
        enable_auto_stop:
          type: boolean
        complete_on_stop:
          type: boolean
          description: When true, Control Panel completes the YouTube Live broadcast during normal stream stop.
    YouTubeRuntimeConfig:
      type: object
      additionalProperties: false
      required: [mode]
      allOf:
        - if:
            properties:
              mode: {const: live_api_relay_static}
            required: [mode]
          then:
            required: [mode, output_id, oauth_account_id, relay_binding_id, reusable_live_stream_id, broadcast_id, live_stream_id, complete_on_stop]
            properties:
              output_id: {type: string, minLength: 1}
              oauth_account_id: {type: string, minLength: 1}
              relay_binding_id: {type: string, pattern: "^relay-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"}
              reusable_live_stream_id: {type: string, minLength: 1}
              broadcast_id: {type: string, minLength: 1}
              live_stream_id: {type: string, minLength: 1}
              complete_on_stop: {const: true}
            not:
              anyOf:
                - required: [rtmp_url]
                - required: [stream_key_secret_name]
      properties:
        mode:
          type: string
          enum: [stream_key, live_api_dry_run, live_api, live_api_relay_static]
        output_id:
          type: string
        oauth_account_id:
          type: string
        broadcast_id:
          type: string
        live_stream_id:
          type: string
        relay_binding_id:
          type: string
          pattern: "^relay-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          description: Non-secret fixed relay binding identity for live_api_relay_static.
        reusable_live_stream_id:
          type: string
          description: Non-secret reusable YouTube LiveStream identity for live_api_relay_static. No ingestion address or stream key is present.
        rtmp_url:
          type: string
          pattern: "^rtmps://"
          description: Prepared RTMPS ingest URL for recovering an active YouTube Live API runtime. Stream key material remains in stream_key_secret_name.
        stream_key_secret_name:
          type: string
          description: Short-lived runtime secret reference for YouTube Live API stream key. The raw key must not be included in this object.
        watch_url:
          type: string
          format: uri
          pattern: "^https://www\\.youtube\\.com/watch\\?v=[A-Za-z0-9_-]{6,32}$"
          description: Canonical public watch URL. Live API modes derive it from broadcast_id; live_api_relay_static runtime may carry it. stream_key mode uses the configured output watch_url.
        dry_run:
          type: boolean
        complete_on_stop:
          type: boolean
          description: When true, Control Panel completes the YouTube Live broadcast during normal stream stop.
    YouTubeRelayStaticRecoveryResolveRequest:
      $ref: "../schemas/youtube-relay-static-recovery-resolve-request.schema.json"
    YouTubeRelayStaticRecoveryResolveResponse:
      $ref: "../schemas/youtube-relay-static-recovery-resolve-response.schema.json"
    Profile:
      type: object
      required: [id, kind, name, config, created_at, updated_at]
      properties:
        id:
          type: string
        kind:
          enum: [encoder, archive, caption, overlay, discord_config, youtube_output]
        name:
          type: string
        config:
          type: object
          additionalProperties: true
          description: Secret references may be present, but raw secret values must not be returned.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ServiceRuntimeConfig:
      type: object
      description: Runtime config for the authenticated service. It contains only public service metadata, that service's assignments, and Control Panel-managed non-secret profiles filtered to that service.
      required: [service, assignments, profiles]
      properties:
        service:
          $ref: "#/components/schemas/RegisteredService"
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/StreamServiceAssignment"
        profiles:
          type: object
          description: Non-secret runtime profiles. Raw bot tokens, stream keys, refresh tokens, Drive folder IDs, webhook URLs, SMTP settings, and credential material must be represented only by configured status, fingerprints, or runtime secret reference names.
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/Profile"
        stream_discord_configs:
          type: array
          description: Resolved per-stream Discord guild/channel settings for the authenticated Discord Bot service only. Raw bot tokens are never included.
          items:
            type: object
            additionalProperties: false
            required: [stream_id, assignment_role, discord_config_id, guild_id, voice_channel_id]
            properties:
              stream_id:
                type: string
              assignment_role:
                type: string
                enum: [primary, standby]
              discord_config_id:
                type: string
              guild_id:
                type: string
              voice_channel_id:
                type: string
              text_channel_id:
                type: string
              auto_start_trigger:
                type: string
                enum: [discord_voice_join]
                description: Present only when this stream is explicitly allowed to auto-start from a Discord voice-channel join.
        stream_archive_configs:
          type: array
          description: Resolved per-stream archive settings for the authenticated Encoder/Recorder service only. It includes runtime secret reference names and shared-drive flags, but never raw Drive folder IDs, OAuth refresh tokens, client secrets, or credential JSON.
          items:
            type: object
            additionalProperties: false
            required: [stream_id, assignment_role, archive_profile_id, ready]
            properties:
              stream_id:
                type: string
              assignment_role:
                type: string
                enum: [primary, standby]
              archive_profile_id:
                type: string
              ready:
                type: boolean
              readiness_code:
                type: string
              readiness_message:
                type: string
              archive_config:
                type: object
                description: Non-secret archive dispatch config. Secret material is represented by *_secret_name fields only.
                additionalProperties: true
                properties:
                  drive_destination_id:
                    type: string
                  archive_profile_id:
                    type: string
                  auth_mode:
                    type: string
                    enum: [oauth2]
                  oauth_account_id:
                    type: string
                  oauth_provider_id:
                    type: string
                  folder_id_secret_name:
                    type: string
                  base_path:
                    type: string
                    deprecated: true
                    description: Ignored legacy value. folder_id is the archive root.
                  shared_drive:
                    type: boolean
                  client_id:
                    type: string
                  client_secret_secret_name:
                    type: string
                  refresh_token_secret_name:
                    type: string
        stream_youtube_configs:
          type: array
          description: Resolved per-stream YouTube output settings for the authenticated Encoder/Recorder service only. It includes RTMPS endpoint metadata and runtime secret reference names, but never raw stream keys, OAuth refresh tokens, or YouTube credential material.
          items:
            type: object
            additionalProperties: false
            required: [stream_id, assignment_role, youtube_output_id, ready]
            allOf:
              - if:
                  required: [ready, youtube_config]
                  properties:
                    ready: {const: true}
                    youtube_config:
                      type: object
                      required: [mode]
                      properties:
                        mode: {const: live_api_relay_static}
                then:
                  properties:
                    youtube_config:
                      required: [mode, output_id, oauth_account_id, relay_binding_id, reusable_live_stream_id, complete_on_stop]
                      properties:
                        output_id: {type: string, minLength: 1}
                        oauth_account_id: {type: string, minLength: 1}
                        relay_binding_id: {type: string, pattern: "^relay-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"}
                        reusable_live_stream_id: {type: string, minLength: 1}
                        complete_on_stop: {const: true}
              - if:
                  required: [active_runtime]
                  properties:
                    active_runtime:
                      type: object
                      required: [mode]
                      properties:
                        mode: {const: live_api_relay_static}
                then:
                  properties:
                    active_runtime:
                      required: [mode, output_id, oauth_account_id, broadcast_id, live_stream_id, complete_on_stop]
                      properties:
                        output_id: {type: string, minLength: 1}
                        oauth_account_id: {type: string, minLength: 1}
                        broadcast_id: {type: string, minLength: 1}
                        live_stream_id: {type: string, minLength: 1}
                        complete_on_stop: {const: true}
            properties:
              stream_id:
                type: string
              assignment_role:
                type: string
                enum: [primary, standby]
              youtube_output_id:
                type: string
              ready:
                type: boolean
              readiness_code:
                type: string
              readiness_message:
                type: string
              youtube_config:
                type: object
                description: Non-secret YouTube dispatch config. Stream key material is represented by stream_key_secret_name only.
                additionalProperties: true
                allOf:
                  - if:
                      properties:
                        mode: {const: live_api_relay_static}
                      required: [mode]
                    then:
                      not:
                        anyOf:
                          - required: [rtmp_url]
                          - required: [stream_key_secret_name]
                          - required: [stream_key]
                properties:
                  mode:
                    type: string
                    enum: [stream_key, live_api, live_api_dry_run, live_api_relay_static]
                  output_id:
                    type: string
                  rtmp_url:
                    type: string
                    pattern: "^rtmps://"
                  stream_key_secret_name:
                    type: string
                  oauth_account_id:
                    type: string
                  relay_binding_id:
                    type: string
                    pattern: "^relay-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
                    description: Non-secret fixed relay binding identity for live_api_relay_static.
                  reusable_live_stream_id:
                    type: string
                    description: Non-secret reusable YouTube LiveStream identity for live_api_relay_static.
                  broadcast_title_template:
                    type: string
                  broadcast_description:
                    type: string
                  privacy_status:
                    type: string
                    enum: [private, unlisted, public]
                  latency_preference:
                    type: string
                    enum: [normal, low, ultra_low]
                  enable_auto_start:
                    type: boolean
                  enable_auto_stop:
                    type: boolean
                  complete_on_stop:
                    type: boolean
                  watch_url:
                    type: string
                    format: uri
                    pattern: "^https://www\\.youtube\\.com/watch\\?v=[A-Za-z0-9_-]{6,32}$"
                    description: Canonical public YouTube watch URL derived for the live API runtime. It contains no stream key or OAuth credential.
              active_runtime:
                type: object
                description: Current non-secret YouTube runtime state. Runtime stream keys are represented by stream_key_secret_name only.
                additionalProperties: true
                allOf:
                  - if:
                      properties:
                        mode: {const: live_api_relay_static}
                      required: [mode]
                    then:
                      not:
                        anyOf:
                          - required: [rtmp_url]
                          - required: [stream_key_secret_name]
                          - required: [stream_key]
                properties:
                  mode:
                    type: string
                    enum: [stream_key, live_api, live_api_dry_run, live_api_relay_static]
                  output_id:
                    type: string
                  oauth_account_id:
                    type: string
                  broadcast_id:
                    type: string
                  live_stream_id:
                    type: string
                  relay_binding_id:
                    type: string
                    pattern: "^relay-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
                  reusable_live_stream_id:
                    type: string
                  rtmp_url:
                    type: string
                    pattern: "^rtmps://"
                  stream_key_secret_name:
                    type: string
                  dry_run:
                    type: boolean
                  complete_on_stop:
                    type: boolean
                  watch_url:
                    type: string
                    format: uri
                    pattern: "^https://www\\.youtube\\.com/watch\\?v=[A-Za-z0-9_-]{6,32}$"
                    description: Canonical public YouTube watch URL derived for the live API runtime. It contains no stream key or OAuth credential.
    ServiceRuntimeSecretResolveRequest:
      type: object
      additionalProperties: false
      required: [service_id, secret_name]
      properties:
        service_id:
          type: string
          minLength: 1
        stream_id:
          type: string
          description: Required for stream-scoped integration secrets such as Drive destination folder IDs.
        archive_profile_id:
          type: string
          description: Required for archive runtime secret references delivered in Encoder/Recorder start payloads.
        secret_name:
          type: string
          minLength: 1
          maxLength: 128
          description: Secret reference name previously returned in the authenticated service runtime config.
    ServiceRuntimeSecretResolveResponse:
      type: object
      additionalProperties: false
      required: [secret_name, value, expires_in_sec]
      properties:
        secret_name:
          type: string
        value:
          type: string
          description: Raw runtime secret. This is returned only to the authenticated service and must not be reused in UI, audit metadata, diagnostics, or logs.
        expires_in_sec:
          type: integer
          minimum: 1
          description: Lease lifetime for this resolved value. During this window, the same service/context/secret returns runtime_secret_lease_active instead of the raw value.
    ServiceNotificationEmailRequest:
      type: object
      additionalProperties: false
      required: [recipients, subject, text]
      properties:
        recipients:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            format: email
            maxLength: 320
            pattern: '^[^\r\n]+$'
            description: Bare mailbox address only; display names and CR/LF are rejected.
          description: Email envelope recipients. Responses and errors never reflect these addresses raw.
        subject:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '^[^\r\n]*$'
          description: Email subject. The server counts Unicode code points and rejects CR/LF to prevent header injection.
        text:
          type: string
          minLength: 1
          maxLength: 16384
          pattern: '^[^\u0000]*$'
          description: Plain-text body. The server enforces a maximum of 16,384 UTF-8 bytes and rejects NUL.
        html:
          type: string
          maxLength: 65536
          pattern: '^[^\u0000]*$'
          description: Optional HTML alternative. The server enforces a maximum of 65,536 UTF-8 bytes and rejects NUL; callers must keep text as the plain-text fallback.
    ServiceNotificationEmailResponse:
      type: object
      additionalProperties: false
      required: [status, recipient_count]
      properties:
        status:
          type: string
          const: sent
        recipient_count:
          type: integer
          minimum: 1
          maximum: 20
          description: Number of recipients submitted without returning their addresses.
    StreamArtifact:
      type: object
      additionalProperties: false
      required: [kind, name, relative_path, size_bytes]
      oneOf:
        - properties: {kind: {const: archive}, name: {const: final.mp4}}
        - properties: {kind: {const: caption}, name: {const: captions.vtt}}
        - properties: {kind: {const: transcript}, name: {const: transcript.json}}
        - properties: {kind: {const: metadata}, name: {const: metadata.json}}
        - properties: {kind: {const: logs}, name: {const: logs.jsonl}}
      properties:
        kind:
          enum: [archive, caption, transcript, metadata, logs]
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: "^[^/\\\\]+$"
        relative_path:
          type: string
          minLength: 1
          maxLength: 1024
          pattern: "^final/[^/\\\\]+/[^/\\\\]+$"
          description: Logical final/{stream_id}/{name} path; the server verifies the embedded stream and file name.
        size_bytes:
          type: integer
          minimum: 0
    ServiceArtifactReport:
      type: object
      additionalProperties: false
      required: [service_id, stream_id, artifacts]
      properties:
        service_id:
          type: string
          minLength: 1
        stream_id:
          type: string
          minLength: 1
        artifacts:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/StreamArtifact"
    ControlNotificationChannelUpdateRequest:
      type: object
      additionalProperties: false
      required: [name, type, enabled]
      description: Control Panel notification-channel update. Per-channel SMTP fields and uses_global_smtp are not accepted. migrate_to_global_smtp is the only supported delivery-mode transition; true migrates an existing legacy email channel to globally managed application SMTP, while omission or false preserves the current mode. Omitting email_recipients preserves the existing masked recipient set.
      properties:
        name:
          type: string
          minLength: 1
        type:
          enum: [discord, slack, generic, email]
        enabled:
          type: boolean
        webhook_url:
          type: string
          format: uri
          pattern: "^https?://"
          writeOnly: true
          description: Optional write-only webhook replacement. Omission preserves the existing encrypted URL; it is never returned raw.
        email_recipients:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            format: email
            maxLength: 320
            pattern: '^[^\r\n]+$'
            description: Bare mailbox address only; display names and CR/LF are rejected.
          description: Optional replacement recipient set. Omission preserves existing recipients; an explicitly empty array is invalid.
        migrate_to_global_smtp:
          type: boolean
          writeOnly: true
          description: Set true to migrate an existing legacy email channel from per-channel SMTP to globally managed application SMTP. Omission or false preserves the current delivery mode; this request flag is never returned.
        severity_filter:
          type: array
          uniqueItems: true
          items:
            enum: [info, warning, error, critical]
        event_type_filter:
          type: array
          uniqueItems: true
          items:
            type: string
    ControlNotificationChannelCreateRequest:
      description: Control Panel notification-channel creation. Email channels always use globally managed application SMTP settings, enforced by the backend. Per-channel SMTP fields and uses_global_smtp are not accepted.
      allOf:
        - $ref: "#/components/schemas/ControlNotificationChannelUpdateRequest"
        - not:
            required: [migrate_to_global_smtp]
        - if:
            required: [type]
            properties:
              type:
                const: email
          then:
            required: [email_recipients]
            properties:
              email_recipients: {}
    NotificationDeliveryResult:
      type: object
      additionalProperties: false
      required: [event_type, channel, target, status]
      properties:
        event_type:
          type: string
          enum: [stream.started, stream.live, stream.completed, stream.failed, stream.warning, stream.error, incident.opened, incident.updated, incident.resolved, diagnostic.created, remediation.pending_approval, remediation.executed, archive.upload.completed, archive.upload.failed, service.offline, service.recovered, admin.audit]
        channel:
          type: string
          enum: [discord, slack, generic, email]
        target:
          type: string
          minLength: 1
          maxLength: 512
          pattern: '^[^\u0000-\u001F\u007F]+$'
          description: Masked delivery target only. Raw webhook URLs and email recipient addresses are never returned.
        status:
          type: string
          enum: [success, failure]
        error:
          type: string
          maxLength: 512
          pattern: '^[^\u0000-\u001F\u007F]*$'
          description: Optional sanitized error. Raw provider responses, target URLs, credentials, and tokens are never returned.
    NotificationChannel:
      type: object
      additionalProperties: false
      required: [id, name, type, enabled, uses_global_smtp, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          enum: [discord, slack, generic, email]
        enabled:
          type: boolean
        uses_global_smtp:
          type: boolean
          description: Whether this email channel delegates delivery to Control Panel using globally managed application SMTP settings. This reveals no SMTP credentials.
        masked_webhook_url:
          type: string
          description: Raw webhook URL is never returned.
        smtp_password_configured:
          type: boolean
          deprecated: true
          description: Deprecated direct-Observability SMTP compatibility status. False for global-SMTP channels and never exposes the password.
        masked_email_target:
          type: string
          description: Raw email recipients and SMTP settings are never returned as unmasked response fields.
        severity_filter:
          type: array
          items:
            enum: [info, warning, error, critical]
        event_type_filter:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    OAuthLoginProvider:
      type: object
      additionalProperties: false
      required: [id, provider_type, name, scopes, redirect_uri]
      properties:
        id: {type: string}
        provider_type:
          enum: [google, github, discord]
        name: {type: string}
        scopes:
          type: array
          items: {type: string}
        redirect_uri:
          type: string
          format: uri
    OAuthLoginStartRequest:
      type: object
      additionalProperties: false
      properties:
        redirect_after:
          type: string
          description: same-site relative path to return to after login
    OAuthLoginStartResponse:
      type: object
      additionalProperties: false
      required: [provider, authorization_url, state, nonce, expires_at]
      properties:
        provider:
          $ref: "#/components/schemas/OAuthLoginProvider"
        authorization_url:
          type: string
          format: uri
        state:
          type: string
          description: one-time OAuth state token; stored hashed server-side
        nonce:
          type: string
          description: one-time nonce for OIDC-capable providers
        expires_at:
          type: string
          format: date-time
    OAuthLoginCallbackRequest:
      type: object
      additionalProperties: false
      required: [state, code]
      properties:
        provider_id: {type: string}
        state: {type: string}
        code:
          type: string
          writeOnly: true
    OAuthUserLink:
      type: object
      additionalProperties: false
      required: [id, user_id, provider_id, provider_type, subject, created_at, updated_at]
      properties:
        id: {type: string}
        user_id: {type: string}
        provider_id: {type: string}
        provider_type:
          enum: [google, github, discord]
        subject: {type: string}
        email: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    OAuthUserLinkWriteRequest:
      description: |
        Legacy administrative shape. Production links must be created through
        the OAuth callback ceremony; manual subject entry is disabled by the
        Control Panel and returns manual_oauth_link_disabled.
      type: object
      additionalProperties: false
      required: [provider_id, subject]
      properties:
        provider_id: {type: string}
        provider_type:
          enum: [google, github, discord]
        subject: {type: string}
        email: {type: string}
    OAuthProvider:
      type: object
      additionalProperties: false
      required: [id, provider_type, name, enabled, client_id, client_secret_configured, scopes, allowed_domains, auto_provision, redirect_uri, created_at, updated_at]
      properties:
        id: {type: string}
        provider_type:
          enum: [google, github, discord]
        name: {type: string}
        enabled: {type: boolean}
        client_id: {type: string}
        client_secret_configured: {type: boolean}
        scopes:
          type: array
          items: {type: string}
        allowed_domains:
          type: array
          items: {type: string}
        auto_provision:
          type: boolean
          description: When true, an allowed but unlinked OAuth identity may create a local user with default_role_ids on first login.
        default_role_ids:
          type: array
          items: {type: string}
          description: Role IDs assigned to auto-provisioned users. Raw permissions are resolved server-side.
        redirect_uri:
          type: string
          format: uri
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    OAuthProviderWriteRequest:
      type: object
      additionalProperties: false
      description: >
        OAuth provider configuration. Login providers use /auth/oauth/callback.
        Google connected accounts for Drive/YouTube use /integrations/oauth-accounts/callback;
        that path requires provider_type=google, a Drive or YouTube API scope,
        and no auto_provision/default_role_ids.
      required: [provider_type, name, enabled, client_id, redirect_uri]
      properties:
        provider_type:
          enum: [google, github, discord]
        name: {type: string}
        enabled: {type: boolean}
        client_id: {type: string}
        client_secret:
          type: string
          writeOnly: true
          description: encrypted at rest; never returned by API
        scopes:
          type: array
          items: {type: string}
        allowed_domains:
          type: array
          items: {type: string}
        auto_provision:
          type: boolean
          description: Enable first-login user creation for allowed OAuth identities.
        default_role_ids:
          type: array
          items: {type: string}
          description: Required when auto_provision is true. Server requires roles.assign for this field.
        redirect_uri:
          type: string
          format: uri
          description: Must match AUTOSTREAM_PUBLIC_URL scheme/host in production.
    OAuthAccount:
      type: object
      additionalProperties: false
      required: [id, provider_id, provider_type, account_label, account_purpose, scopes, refresh_token_configured, created_at, updated_at]
      properties:
        id: {type: string}
        provider_id: {type: string}
        provider_type:
          enum: [google, github, discord]
        provider_name:
          type: string
          description: Configured OAuth provider name used to build a legacy display fallback.
        account_label: {type: string}
        account_purpose:
          type: string
          enum: [drive, youtube, drive_youtube, unknown]
          description: Effective connected-account capability derived from the returned scopes. unknown is returned only when no Drive or YouTube capability is present.
        display_name:
          type: string
          description: Resolved operator-facing name. A configured account label takes precedence; legacy rows use the provider name plus a stable short account reference so multiple accounts remain distinguishable.
        subject: {type: string}
        email: {type: string}
        scopes:
          type: array
          items: {type: string}
        refresh_token_configured: {type: boolean}
        token_fingerprint:
          type: string
          description: short fingerprint for change tracking, not a secret value
        refresh_token_updated_at:
          type: string
          description: RFC3339 timestamp when the stored OAuth refresh token was first registered or replaced; legacy accounts without recorded history return an empty string
        access_token_refreshed_at:
          type: string
          description: RFC3339 timestamp when the short-lived OAuth access token was last refreshed automatically; the access token itself is never returned or persisted
        access_token_refresh_attempted_at:
          type: string
          description: RFC3339 timestamp when automatic access-token refresh was last attempted; legacy accounts without recorded history return an empty string
        access_token_refresh_failed_at:
          type: string
          description: RFC3339 timestamp of the active automatic refresh failure; empty after a successful refresh or when no failure is recorded
        access_token_refresh_failure_code:
          type: string
          enum: ["", unknown, credentials_unavailable, provider_not_ready, provider_unavailable, provider_credentials_invalid, reauthorization_required, timeout, invalid_response]
          description: Bounded non-secret operational failure class. Provider response bodies, error descriptions, and tokens are never returned.
        access_token_refresh_relink_required:
          type: boolean
          description: True only when the recorded automatic refresh failure requires reconnecting this existing OAuth account; reconnecting retains the account ID and its references.
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    OAuthAccountWriteRequest:
      type: object
      deprecated: true
      description: >
        Legacy manual import shape. The Control Panel rejects normal API calls
        that try to create connected accounts or update refresh tokens manually;
        connected accounts are created by OAuth callback only.
      additionalProperties: false
      required: [provider_id, provider_type, account_label]
      properties:
        provider_id: {type: string}
        provider_type:
          enum: [google, github, discord]
        account_label: {type: string}
        subject: {type: string}
        email: {type: string}
        scopes:
          type: array
          items: {type: string}
        refresh_token:
          type: string
          writeOnly: true
          description: manual refresh token input is disabled; callback stores it encrypted at rest
    OAuthAccountLabelUpdateRequest:
      type: object
      additionalProperties: false
      required: [account_label]
      properties:
        account_label:
          type: string
          description: Operator-facing label. Provider identity, scopes, and refresh token remain immutable outside OAuth callback.
    OAuthAccountConnectionStartRequest:
      type: object
      additionalProperties: false
      anyOf:
        - required: [provider_id]
        - required: [oauth_account_id]
      properties:
        provider_id:
          type: string
          minLength: 1
          description: OAuth provider configured in the Integration Registry
        oauth_account_id:
          type: string
          minLength: 1
          description: Existing connected-account ID to re-link. The server derives provider_id when it is omitted.
        account_label:
          type: string
          description: optional operator label; callback may derive a label from the verified email
        account_purpose:
          type: string
          description: Optional requested connected-account capability. Canonical values are drive, youtube, and drive_youtube; documented compatibility aliases are accepted and normalized by the Control Panel.
        redirect_after:
          type: string
          description: safe local path to redirect to after browser callback
    OAuthAccountConnectionStartResponse:
      $ref: "../schemas/oauth-account-connection-start-response.schema.json"
    OAuthAccountConnectionCallbackRequest:
      type: object
      additionalProperties: false
      required: [state, code]
      properties:
        provider_id:
          type: string
          description: optional explicit provider id; must match state when supplied
        state:
          type: string
        code:
          type: string
        account_label:
          type: string
    DriveDestination:
      type: object
      additionalProperties: false
      required: [id, name, auth_mode, folder_id_configured, shared_drive, base_path, created_at, updated_at]
      properties:
        id: {type: string}
        name: {type: string}
        auth_mode:
          enum: [oauth2]
        oauth_account_id: {type: string}
        folder_id_configured: {type: boolean}
        folder_id_fingerprint:
          type: string
          description: short fingerprint for change tracking, not the raw folder ID
        masked_folder_id: {type: string}
        shared_drive:
          type: boolean
          description: use supportsAllDrives=true when uploading
        base_path:
          type: string
          deprecated: true
          description: Legacy value retained for compatible reads. folder_id is the archive root.
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    DriveDestinationWriteRequest:
      type: object
      additionalProperties: false
      required: [name, auth_mode, oauth_account_id]
      properties:
        name: {type: string}
        auth_mode:
          enum: [oauth2]
        oauth_account_id:
          type: string
          minLength: 1
          description: Required for oauth2 destinations and must reference a Google connected account with Drive scope.
        folder_id:
          type: string
          writeOnly: true
          description: required when creating a destination, optional when updating an existing destination, encrypted at rest, and never returned by API
        shared_drive:
          type: boolean
        base_path:
          type: string
          deprecated: true
          description: Legacy compatibility input. Current Encoder/Recorder ignores this value and uses folder_id itself as the archive root.
    StartStreamRequest:
      type: object
      additionalProperties: false
      properties:
        discord_config_id:
          type: string
          description: Discord Bot Config selected for this stream. Required before stream-specific guild/channel overrides can be used. Control Panel resolves guild/channel server-side and verifies it matches the assigned primary Discord Bot service.
        discord_guild_id:
          type: string
          description: Stream-specific Discord guild ID override. Valid only with discord_config_id. If omitted, the selected Discord Config default is used.
        discord_voice_channel_id:
          type: string
          description: Stream-specific Discord voice channel ID override. Valid only with discord_config_id. If omitted, the selected Discord Config default is used.
        discord_text_channel_id:
          type: string
          description: Optional stream-specific Discord text channel ID override. Valid only with discord_config_id. If omitted, the selected Discord Config default is used.
        encoder_input_url:
          type: string
        encoder_rtmp_url:
          type: string
        encoder_profile_id:
          type: string
        caption_profile_id:
          type: string
        overlay_profile_id:
          type: string
        encoder_audio_gain_db:
          type: number
          minimum: -60
          maximum: 24
          default: 0
        archive_profile_id:
          type: string
        youtube_output_id:
          type: string
          description: YouTube output profile selected for this stream. Stream key is resolved server-side from a secret reference and is never accepted or returned by the public Control API.
    DiscordYouTubeLiveNotification:
      type: object
      additionalProperties: false
      required:
        - id
        - stream_id
        - watch_url
        - discord_service_id
        - discord_text_channel_id
        - youtube_mode
        - state
        - attempt_count
        - dispatch_attempt_count
        - created_at
        - updated_at
      properties:
        id:
          type: string
        stream_id:
          type: string
        watch_url:
          type: string
          format: uri
          description: Canonical public YouTube watch URL; no RTMP URL or stream key is included.
        discord_service_id:
          type: string
        discord_text_channel_id:
          type: string
        youtube_mode:
          type: string
          enum: [stream_key, live_api, live_api_relay_static]
        youtube_broadcast_id:
          type: string
        lifecycle_status:
          type: string
          description: Provider status when known; stream_key uses legacy_unverified by explicit compatibility policy.
        state:
          type: string
          enum: [awaiting_youtube_live, dispatch_pending, dispatching, bot_dispatching, delivered, delivery_unknown, suppressed]
        attempt_count:
          type: integer
          minimum: 0
        dispatch_attempt_count:
          type: integer
          minimum: 0
        next_attempt_at:
          type: string
          format: date-time
        last_error:
          type: string
          description: Stable, secret-safe delivery state code; raw Bot errors are not exposed.
        discord_message_id:
          type: string
          description: Bot-confirmed Discord receipt only.
        delivered_at:
          type: string
          format: date-time
        recovery_of_id:
          type: string
          description: Prior delivery_unknown record acknowledged by an operator.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DiscordYouTubeLiveNotificationResponse:
      type: object
      additionalProperties: false
      required: [notification]
      properties:
        notification:
          $ref: "#/components/schemas/DiscordYouTubeLiveNotification"
    DiscordYouTubeLiveNotificationRecoveryRequest:
      type: object
      additionalProperties: false
      required: [acknowledge_possible_duplicate]
      properties:
        acknowledge_possible_duplicate:
          type: boolean
          const: true
          description: Explicit operator attestation that the original request may already have posted to Discord.
    StreamSettingsWriteRequest:
      type: object
      additionalProperties: false
      properties:
        discord_config_id:
          type: string
          description: Control Panel managed Discord Bot Config. Required when Discord guild/channel overrides are provided.
        discord_guild_id:
          type: string
          description: Stream-specific Discord guild ID override. Valid only with discord_config_id.
        discord_voice_channel_id:
          type: string
          description: Stream-specific Discord voice channel ID override. Valid only with discord_config_id.
        discord_text_channel_id:
          type: string
          description: Optional stream-specific Discord text channel ID override. Valid only with discord_config_id.
        auto_start_trigger:
          type: string
          enum: ["", discord_voice_join]
          description: Set to discord_voice_join to allow this waiting stream to start automatically when a user joins the configured Discord voice channel. Empty or omitted disables automatic start.
        encoder_profile_id:
          type: string
        caption_profile_id:
          type: string
        overlay_profile_id:
          type: string
        encoder_audio_gain_db:
          type: number
          minimum: -60
          maximum: 24
          default: 0
        archive_profile_id:
          type: string
        youtube_output_id:
          type: string
        encoder_input_url:
          type: string
    StreamWriteRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        discord_config_id:
          type: string
          description: Control Panel managed Discord Bot Config. Required when Discord guild/channel overrides are provided.
        discord_guild_id:
          type: string
          description: Stream-specific Discord guild ID override. Valid only with discord_config_id.
        discord_voice_channel_id:
          type: string
          description: Stream-specific Discord voice channel ID override. Valid only with discord_config_id.
        discord_text_channel_id:
          type: string
          description: Optional stream-specific Discord text channel ID override. Valid only with discord_config_id.
        auto_start_trigger:
          type: string
          enum: ["", discord_voice_join]
          description: Set to discord_voice_join to allow this waiting stream to start automatically when a user joins the configured Discord voice channel. Empty or omitted disables automatic start.
        encoder_profile_id:
          type: string
        caption_profile_id:
          type: string
        overlay_profile_id:
          type: string
        encoder_audio_gain_db:
          type: number
          minimum: -60
          maximum: 24
          default: 0
        archive_profile_id:
          type: string
        youtube_output_id:
          type: string
        encoder_input_url:
          type: string
    EncoderRuntimeSettingsRequest:
      $ref: "../schemas/encoder-runtime-settings-request.schema.json"
    MissingStreamAssignmentsResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - missing_service_types
      properties:
        code:
          type: string
          enum:
            - missing_stream_assignments
        missing_service_types:
          type: array
          items:
            type: string
            enum:
              - discord_bot
              - worker
              - encoder_recorder
    ReadinessIssue:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        service_id:
          type: string
        service_type:
          type: string
        code:
          type: string
          enum:
            - missing_stream_assignments
            - service_call_token_missing
            - service_public_url_invalid
            - service_public_url_blocked
            - encoder_public_url_missing
            - encoder_public_url_invalid
            - encoder_public_url_blocked
            - service_offline
            - service_heartbeat_stale
            - discord_audio_forward_unavailable
            - discord_audio_capture_unavailable
            - discord_caption_audio_forward_unavailable
            - worker_deepgram_transcription_unavailable
            - discord_config_required
            - discord_config_not_found
            - discord_config_invalid
            - discord_config_service_mismatch
            - youtube_output_not_found
            - youtube_output_invalid_config
            - youtube_stream_key_unavailable
            - youtube_live_api_unavailable
            - youtube_oauth_account_unavailable
            - archive_profile_not_found
            - archive_profile_invalid_config
            - drive_destination_not_found
            - drive_destination_unavailable
            - drive_oauth_account_unavailable
        message:
          type: string
    StartReadinessResponse:
      type: object
      additionalProperties: false
      required:
        - stream_id
        - ready
        - missing_service_types
        - issues
        - assigned_service_count
        - primary_service_count
      properties:
        stream_id:
          type: string
        ready:
          type: boolean
        missing_service_types:
          type: array
          items:
            type: string
            enum:
              - discord_bot
              - worker
              - encoder_recorder
        issues:
          type: array
          items:
            $ref: "#/components/schemas/ReadinessIssue"
        assigned_service_count:
          type: integer
          minimum: 0
        primary_service_count:
          type: integer
          minimum: 0
          description: Number of primary assignments eligible for start dispatch. Standby assignments are listed but excluded until promoted.
        assignments:
          type: array
          description: Public registered service summaries. Service token binding IDs and raw tokens are never returned.
          items:
            $ref: "#/components/schemas/RegisteredService"
    ExternalE2EConfigResponse:
      type: object
      additionalProperties: false
      required: [schema_version, stream_id, runtime_config, service_assignments, confirmations, readiness]
      properties:
        schema_version:
          type: integer
          enum: [1]
          description: Version of the non-secret external verification confirmation export schema.
        stream_id:
          type: string
        runtime_config:
          type: object
          additionalProperties: false
          description: Control Panel-managed runtime config IDs only. Raw Discord channel IDs, Drive folder IDs, OAuth tokens, RTMPS URLs, stream keys, and session cookies are never returned.
          required: [youtube_output_id, drive_destination_id, discord_config_id, encoder_profile_id, archive_profile_id]
          properties:
            youtube_output_id:
              type: string
            drive_destination_id:
              type: string
            discord_config_id:
              type: string
            encoder_profile_id:
              type: string
            archive_profile_id:
              type: string
        service_assignments:
          type: object
          additionalProperties: false
          description: Assigned service IDs only. Service token binding IDs and raw service tokens are never returned.
          required: [discord_bot_service_id, encoder_recorder_primary_service_id, worker_primary_service_id, encoder_recorder_standby_service_id, worker_standby_service_id]
          properties:
            discord_bot_service_id:
              type: string
            encoder_recorder_primary_service_id:
              type: string
            worker_primary_service_id:
              type: string
            encoder_recorder_standby_service_id:
              type: string
            worker_standby_service_id:
              type: string
        confirmations:
          type: object
          additionalProperties: false
          required: [youtube_output_saved, drive_destination_saved, discord_config_saved, primary_assignments_saved, runtime_config_distribution_enabled]
          properties:
            youtube_output_saved:
              type: boolean
            drive_destination_saved:
              type: boolean
            discord_config_saved:
              type: boolean
            primary_assignments_saved:
              type: boolean
            runtime_config_distribution_enabled:
              type: boolean
        readiness:
          type: object
          additionalProperties: false
          description: Secret-safe external verification readiness summary. Missing lists contain field names, service types, or capability names only.
          required: [ready, missing_confirmations, missing_runtime_ids, missing_primary_services, missing_runtime_config_capabilities]
          properties:
            ready:
              type: boolean
            missing_confirmations:
              type: array
              items:
                type: string
            missing_runtime_ids:
              type: array
              items:
                type: string
            missing_primary_services:
              type: array
              items:
                type: string
            missing_runtime_config_capabilities:
              type: array
              items:
                type: string
