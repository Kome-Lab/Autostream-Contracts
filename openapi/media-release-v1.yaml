{
  "openapi": "3.1.0",
  "info": {
    "title": "AutoStream Media Release API",
    "version": "1",
    "description": "Owner-scoped, version-negotiated proof handoff for CP admission, Worker binding, Encoder cover, permit, consumption and release receipt. Each mutation requires independent authentication, current owner authority and preassigned original lookup keys. Shared validation has no physical authority."
  },
  "x-autostream-contract": {
    "family": "MediaRelease1",
    "wire_version": "1",
    "profile_id": "MEDIA_RELEASE_HANDOFF_V1",
    "profile_revision": "1",
    "encoding_id": "MR1_JSON_ASCII_V1"
  },
  "servers": [
    {"url": "/v3/media-release/v1"}
  ],
  "security": [
    {
      "serviceToken": []
    }
  ],
  "paths": {
    "/capabilities": {
      "get": {
        "operationId": "getMediaReleaseCapabilities",
        "summary": "Read an owner capability snapshot",
        "description": "Obtain the owner and scope through the authenticated service context. Resolve the actual incarnation and original roster. Exact selection must be durably bound to the attempt before interpreting any release record.",
        "responses": {
          "200": {
            "description": "Owner-attributed capability snapshot.",
            "content": {
              "application/json": {
                "schema": {"$ref": "#/components/schemas/Capability"}
              }
            }
          },
          "400": {"$ref": "#/components/responses/BadRequest"},
          "401": {"$ref": "#/components/responses/Unauthenticated"},
          "403": {"$ref": "#/components/responses/Forbidden"},
          "409": {"$ref": "#/components/responses/Conflict"},
          "503": {"$ref": "#/components/responses/Held"}
        }
      }
    },
    "/admissions": {
      "post": {
        "operationId": "issueStartAdmissionProof",
        "summary": "Issue the CP admission original",
        "description": "Only the CP issues its own current authority after verifying the claim, originals, assignments and reservation.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {"$ref": "#/components/schemas/AdmissionRequest"}
            }
          }
        },
        "responses": {
          "200": {
            "description": "Durable owner record or decision at the identified boundary.",
            "content": {
              "application/json": {
                "schema": {"$ref": "#/components/schemas/CPAdmissionProof"}
              }
            }
          },
          "202": {
            "description": "Accepted for processing. No durable result or physical outcome is asserted. Use the original preassigned lookup key."
          },
          "400": {"$ref": "#/components/responses/BadRequest"},
          "401": {"$ref": "#/components/responses/Unauthenticated"},
          "403": {"$ref": "#/components/responses/Forbidden"},
          "409": {"$ref": "#/components/responses/Conflict"},
          "410": {"$ref": "#/components/responses/Expired"},
          "503": {"$ref": "#/components/responses/Held"}
        }
      }
    },
    "/worker-bindings": {
      "post": {
        "operationId": "bindNonMediaWorker",
        "summary": "Bind the actual Worker without media",
        "description": "The Worker establishes a non-media binding for its own actual process and generation.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {"$ref": "#/components/schemas/BindingRequest"}
            }
          }
        },
        "responses": {
          "200": {
            "description": "Durable owner record or decision at the identified boundary.",
            "content": {
              "application/json": {
                "schema": {"$ref": "#/components/schemas/WorkerNonMediaBinding"}
              }
            }
          },
          "202": {
            "description": "Accepted for processing. No durable result or physical outcome is asserted. Use the original preassigned lookup key."
          },
          "400": {"$ref": "#/components/responses/BadRequest"},
          "401": {"$ref": "#/components/responses/Unauthenticated"},
          "403": {"$ref": "#/components/responses/Forbidden"},
          "409": {"$ref": "#/components/responses/Conflict"},
          "410": {"$ref": "#/components/responses/Expired"},
          "503": {"$ref": "#/components/responses/Held"}
        }
      }
    },
    "/applied-cover-proofs": {
      "post": {
        "operationId": "attestAppliedCover",
        "summary": "Attest cover on a continuously closed graph",
        "description": "Only the actual Encoder may attest an observed cover and independently verified physical closure across every relevant egress.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {"$ref": "#/components/schemas/CoverRequest"}
            }
          }
        },
        "responses": {
          "200": {
            "description": "Durable owner record or decision at the identified boundary.",
            "content": {
              "application/json": {
                "schema": {"$ref": "#/components/schemas/AppliedCoverProof"}
              }
            }
          },
          "202": {
            "description": "Accepted for processing. No durable result or physical outcome is asserted. Use the original preassigned lookup key."
          },
          "400": {"$ref": "#/components/responses/BadRequest"},
          "401": {"$ref": "#/components/responses/Unauthenticated"},
          "403": {"$ref": "#/components/responses/Forbidden"},
          "409": {"$ref": "#/components/responses/Conflict"},
          "410": {"$ref": "#/components/responses/Expired"},
          "503": {"$ref": "#/components/responses/Held"}
        }
      }
    },
    "/permits": {
      "post": {
        "operationId": "issueMediaReleasePermit",
        "summary": "Issue one target-specific release permit",
        "description": "One logical open is bound to its owner, canonical destination, media scope and lifetime. Guard against aliases and overlapping physical units.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {"$ref": "#/components/schemas/PermitRequest"}
            }
          }
        },
        "responses": {
          "200": {
            "description": "Durable owner record or decision at the identified boundary.",
            "content": {
              "application/json": {
                "schema": {"$ref": "#/components/schemas/ReleasePermit"}
              }
            }
          },
          "202": {
            "description": "Accepted for processing. No durable result or physical outcome is asserted. Use the original preassigned lookup key."
          },
          "400": {"$ref": "#/components/responses/BadRequest"},
          "401": {"$ref": "#/components/responses/Unauthenticated"},
          "403": {"$ref": "#/components/responses/Forbidden"},
          "409": {"$ref": "#/components/responses/Conflict"},
          "410": {"$ref": "#/components/responses/Expired"},
          "503": {"$ref": "#/components/responses/Held"}
        }
      }
    },
    "/permit-revocations": {
      "post": {
        "operationId": "revokeMediaReleasePermit",
        "summary": "Record revocation at the issuing CP",
        "description": "The CP freezes issuance for the original target and records its own revocation. Query each egress owner separately for pending activity and physical closure.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {"$ref": "#/components/schemas/FenceRequest"}
            }
          }
        },
        "responses": {
          "200": {
            "description": "Durable owner record or decision at the identified boundary.",
            "content": {
              "application/json": {
                "schema": {"$ref": "#/components/schemas/FenceObservation"}
              }
            }
          },
          "202": {
            "description": "Accepted for processing. No durable result or physical outcome is asserted. Use the original preassigned lookup key."
          },
          "400": {"$ref": "#/components/responses/BadRequest"},
          "401": {"$ref": "#/components/responses/Unauthenticated"},
          "403": {"$ref": "#/components/responses/Forbidden"},
          "409": {"$ref": "#/components/responses/Conflict"},
          "410": {"$ref": "#/components/responses/Expired"},
          "503": {"$ref": "#/components/responses/Held"}
        }
      }
    },
    "/opens": {
      "post": {
        "operationId": "openMediaRelease",
        "summary": "Submit the original open to its sole owner",
        "description": "Only the designated physical owner may durably consume the original slot. Revalidate its exact current authority at irreversible admission. After uncertainty or restart use pure inspection; an observed consumption never grants a transferable continuation.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {"$ref": "#/components/schemas/OpenRequest"}
            }
          }
        },
        "responses": {
          "200": {
            "description": "Durable owner record or decision at the identified boundary.",
            "content": {
              "application/json": {
                "schema": {"$ref": "#/components/schemas/OneTimeConsumption"}
              }
            }
          },
          "202": {
            "description": "Accepted for processing. No durable result or physical outcome is asserted. Use the original preassigned lookup key."
          },
          "400": {"$ref": "#/components/responses/BadRequest"},
          "401": {"$ref": "#/components/responses/Unauthenticated"},
          "403": {"$ref": "#/components/responses/Forbidden"},
          "409": {"$ref": "#/components/responses/Conflict"},
          "410": {"$ref": "#/components/responses/Expired"},
          "503": {"$ref": "#/components/responses/Held"}
        }
      }
    },
    "/fences": {
      "post": {
        "operationId": "fenceMediaRelease",
        "summary": "Fence new admission at the actual effect owner",
        "description": "Fence original admission and observe already admitted work and physical closure independently. Late completion is scoped to the original owner and attempt.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {"$ref": "#/components/schemas/FenceRequest"}
            }
          }
        },
        "responses": {
          "200": {
            "description": "Durable owner record or decision at the identified boundary.",
            "content": {
              "application/json": {
                "schema": {"$ref": "#/components/schemas/FenceObservation"}
              }
            }
          },
          "202": {
            "description": "Accepted for processing. No durable result or physical outcome is asserted. Use the original preassigned lookup key."
          },
          "400": {"$ref": "#/components/responses/BadRequest"},
          "401": {"$ref": "#/components/responses/Unauthenticated"},
          "403": {"$ref": "#/components/responses/Forbidden"},
          "409": {"$ref": "#/components/responses/Conflict"},
          "410": {"$ref": "#/components/responses/Expired"},
          "503": {"$ref": "#/components/responses/Held"}
        }
      }
    },
    "/records/inspect": {
      "post": {
        "operationId": "inspectMediaReleaseRecord",
        "summary": "Inspect the original record without side effects",
        "description": "Return the immutable original when found. Keep currentness separate from lookup. Reading cannot create, reconcile, renew, redial or replay.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {"$ref": "#/components/schemas/InspectRequest"}
            }
          }
        },
        "responses": {
          "200": {
            "description": "Original lookup with separate currentness and scoped evidence.",
            "content": {
              "application/json": {
                "schema": {"$ref": "#/components/schemas/RecordInspection"}
              }
            }
          },
          "400": {"$ref": "#/components/responses/BadRequest"},
          "401": {"$ref": "#/components/responses/Unauthenticated"},
          "403": {"$ref": "#/components/responses/Forbidden"},
          "409": {"$ref": "#/components/responses/Conflict"},
          "503": {"$ref": "#/components/responses/Held"}
        }
      }
    },
    "/receipts/inspect": {
      "post": {
        "operationId": "inspectMediaReleaseReceipt",
        "summary": "Inspect the original release receipt",
        "description": "Only the effect owner records a receipt internally. Request its preassigned key even after loss of an ACK. Local observations do not establish downstream delivery or completion.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {"$ref": "#/components/schemas/ReceiptInspectRequest"}
            }
          }
        },
        "responses": {
          "200": {
            "description": "Original lookup with separate currentness and scoped evidence.",
            "content": {
              "application/json": {
                "schema": {"$ref": "#/components/schemas/ReceiptInspection"}
              }
            }
          },
          "400": {"$ref": "#/components/responses/BadRequest"},
          "401": {"$ref": "#/components/responses/Unauthenticated"},
          "403": {"$ref": "#/components/responses/Forbidden"},
          "409": {"$ref": "#/components/responses/Conflict"},
          "503": {"$ref": "#/components/responses/Held"}
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "serviceToken": {
        "type": "http",
        "scheme": "bearer",
        "description": "Authenticated service principal bound to the actual owner, audience, deployment, role and original scope."
      }
    },
    "responses": {
      "BadRequest": {
        "description": "Invalid version, profile, input or canonical form.",
        "content": {
          "application/json": {
            "schema": {"$ref": "#/components/schemas/Error"}
          }
        }
      },
      "Unauthenticated": {
        "description": "Authenticated identity is required.",
        "content": {
          "application/json": {
            "schema": {"$ref": "#/components/schemas/Error"}
          }
        }
      },
      "Forbidden": {
        "description": "The authenticated principal lacks authority for this scope.",
        "content": {
          "application/json": {
            "schema": {"$ref": "#/components/schemas/Error"}
          }
        }
      },
      "Conflict": {
        "description": "Original identity, revision, tuple or owner conflicts with authoritative evidence.",
        "content": {
          "application/json": {
            "schema": {"$ref": "#/components/schemas/Error"}
          }
        }
      },
      "Expired": {
        "description": "The authority has expired or has been revoked.",
        "content": {
          "application/json": {
            "schema": {"$ref": "#/components/schemas/Error"}
          }
        }
      },
      "Held": {
        "description": "Required evidence or authoritative storage is unavailable. Inspect the original attempt before any further action.",
        "content": {
          "application/json": {
            "schema": {"$ref": "#/components/schemas/Error"}
          }
        }
      }
    },
    "schemas": {
      "ID": {
        "type": "string",
        "minLength": 1,
        "maxLength": 192,
        "pattern": "^[A-Za-z0-9._:/-]+(?![\\s\\S])",
        "description": "Opaque, non-secret identifier in its registered namespace."
      },
      "Uint64": {
        "type": "string",
        "minLength": 1,
        "maxLength": 20,
        "pattern": "^(?:0|[1-9][0-9]{0,18}|1[0-7][0-9]{18}|18[0-3][0-9]{17}|184[0-3][0-9]{16}|1844[0-5][0-9]{15}|18446[0-6][0-9]{14}|184467[0-3][0-9]{13}|1844674[0-3][0-9]{12}|184467440[0-6][0-9]{10}|1844674407[0-2][0-9]{9}|18446744073[0-6][0-9]{8}|1844674407370[0-8][0-9]{6}|18446744073709[0-4][0-9]{5}|184467440737095[0-4][0-9]{4}|18446744073709550[0-9]{3}|18446744073709551[0-5][0-9]{2}|1844674407370955160[0-9]{1}|1844674407370955161[0-4]|18446744073709551615)(?![\\s\\S])",
        "description": "Unsigned decimal integer string from 0 through 18446744073709551615, without leading zeroes."
      },
      "PositiveUint64": {
        "allOf": [
          {"$ref": "#/components/schemas/Uint64"},
          {
            "not": {"const": "0"}
          }
        ]
      },
      "Digest": {
        "type": "string",
        "minLength": 64,
        "maxLength": 64,
        "pattern": "^[0-9a-f]{64}$",
        "description": "Lowercase hexadecimal SHA-256 of the exact specified representation."
      },
      "Instant": {
        "type": "string",
        "format": "date-time",
        "minLength": 30,
        "maxLength": 30,
        "pattern": "^[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]\\.[0-9]{9}Z$",
        "description": "A valid UTC calendar instant with exactly nine fractional digits."
      },
      "Domain": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "deployment_id": {"$ref": "#/components/schemas/ID"},
          "realm_id": {"$ref": "#/components/schemas/ID"},
          "domain_id": {"$ref": "#/components/schemas/ID"}
        },
        "required": ["deployment_id", "realm_id", "domain_id"]
      },
      "Peer": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "component_id": {"$ref": "#/components/schemas/ID"},
          "service_id": {"$ref": "#/components/schemas/ID"},
          "resource_id": {"$ref": "#/components/schemas/ID"}
        },
        "required": ["component_id", "service_id", "resource_id"]
      },
      "Owner": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "component_id": {"$ref": "#/components/schemas/ID"},
          "service_id": {"$ref": "#/components/schemas/ID"},
          "resource_id": {"$ref": "#/components/schemas/ID"},
          "host_id": {"$ref": "#/components/schemas/ID"},
          "boot_id": {"$ref": "#/components/schemas/ID"},
          "process_incarnation": {"$ref": "#/components/schemas/ID"},
          "writer_id": {"$ref": "#/components/schemas/ID"},
          "principal_id": {"$ref": "#/components/schemas/ID"}
        },
        "required": [
          "component_id",
          "service_id",
          "resource_id",
          "host_id",
          "boot_id",
          "process_incarnation",
          "writer_id",
          "principal_id"
        ]
      },
      "Key": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "deployment_id": {"$ref": "#/components/schemas/ID"},
          "owner_id": {"$ref": "#/components/schemas/ID"},
          "kind": {"$ref": "#/components/schemas/ID"},
          "record_id": {"$ref": "#/components/schemas/ID"}
        },
        "required": ["deployment_id", "owner_id", "kind", "record_id"]
      },
      "Original": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "request_id": {"$ref": "#/components/schemas/ID"},
          "operation_id": {"$ref": "#/components/schemas/ID"},
          "attempt_id": {"$ref": "#/components/schemas/ID"},
          "step_id": {"$ref": "#/components/schemas/ID"},
          "execution_key": {"$ref": "#/components/schemas/ID"},
          "stream_id": {"$ref": "#/components/schemas/ID"},
          "job_id": {"$ref": "#/components/schemas/ID"},
          "run_id": {"$ref": "#/components/schemas/ID"}
        },
        "required": ["request_id", "operation_id", "attempt_id", "step_id", "execution_key", "stream_id", "job_id", "run_id"]
      },
      "Ref": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "source_family": {"$ref": "#/components/schemas/ID"},
          "source_version": {"$ref": "#/components/schemas/ID"},
          "source_type": {"$ref": "#/components/schemas/ID"},
          "source_owner": {"$ref": "#/components/schemas/Peer"},
          "source_key": {"$ref": "#/components/schemas/Key"},
          "source_revision": {"$ref": "#/components/schemas/PositiveUint64"},
          "representation": {
            "type": "string",
            "enum": ["MR1_RECORD_V1", "REQUEST1_COMMAND_BYTES", "PINNED_RECORD_BYTES", "OWNER_SEALED_BYTES"]
          },
          "digest": {"$ref": "#/components/schemas/Digest"}
        },
        "required": [
          "source_family",
          "source_version",
          "source_type",
          "source_owner",
          "source_key",
          "source_revision",
          "representation",
          "digest"
        ],
        "description": "Resolve the exact authenticated issuer, key, revision, representation and digest. Original command bytes retain their original encoding and Binding."
      },
      "CPAdmissionProofRef": {
        "allOf": [
          {"$ref": "#/components/schemas/Ref"},
          {
            "properties": {
              "source_family": {"type": "string", "const": "MediaRelease1"},
              "source_version": {"type": "string", "const": "1"},
              "source_type": {"type": "string", "const": "CP_ADMISSION_PROOF"},
              "source_key": {
                "properties": {
                  "kind": {"type": "string", "const": "CP_ADMISSION_PROOF"}
                }
              },
              "representation": {"type": "string", "const": "MR1_RECORD_V1"}
            }
          }
        ]
      },
      "WorkerNonMediaBindingRef": {
        "allOf": [
          {"$ref": "#/components/schemas/Ref"},
          {
            "properties": {
              "source_family": {"type": "string", "const": "MediaRelease1"},
              "source_version": {"type": "string", "const": "1"},
              "source_type": {"type": "string", "const": "WORKER_NON_MEDIA_BINDING"},
              "source_key": {
                "properties": {
                  "kind": {"type": "string", "const": "WORKER_NON_MEDIA_BINDING"}
                }
              },
              "representation": {"type": "string", "const": "MR1_RECORD_V1"}
            }
          }
        ]
      },
      "AppliedCoverProofRef": {
        "allOf": [
          {"$ref": "#/components/schemas/Ref"},
          {
            "properties": {
              "source_family": {"type": "string", "const": "MediaRelease1"},
              "source_version": {"type": "string", "const": "1"},
              "source_type": {"type": "string", "const": "APPLIED_COVER_PROOF"},
              "source_key": {
                "properties": {
                  "kind": {"type": "string", "const": "APPLIED_COVER_PROOF"}
                }
              },
              "representation": {"type": "string", "const": "MR1_RECORD_V1"}
            }
          }
        ]
      },
      "ReleasePermitRef": {
        "allOf": [
          {"$ref": "#/components/schemas/Ref"},
          {
            "properties": {
              "source_family": {"type": "string", "const": "MediaRelease1"},
              "source_version": {"type": "string", "const": "1"},
              "source_type": {"type": "string", "const": "MEDIA_RELEASE_PERMIT"},
              "source_key": {
                "properties": {
                  "kind": {"type": "string", "const": "MEDIA_RELEASE_PERMIT"}
                }
              },
              "representation": {"type": "string", "const": "MR1_RECORD_V1"}
            }
          }
        ]
      },
      "OneTimeConsumptionRef": {
        "allOf": [
          {"$ref": "#/components/schemas/Ref"},
          {
            "properties": {
              "source_family": {"type": "string", "const": "MediaRelease1"},
              "source_version": {"type": "string", "const": "1"},
              "source_type": {"type": "string", "const": "MEDIA_RELEASE_CONSUMPTION"},
              "source_key": {
                "properties": {
                  "kind": {"type": "string", "const": "MEDIA_RELEASE_CONSUMPTION"}
                }
              },
              "representation": {"type": "string", "const": "MR1_RECORD_V1"}
            }
          }
        ]
      },
      "ReleaseReceiptRef": {
        "allOf": [
          {"$ref": "#/components/schemas/Ref"},
          {
            "properties": {
              "source_family": {"type": "string", "const": "MediaRelease1"},
              "source_version": {"type": "string", "const": "1"},
              "source_type": {"type": "string", "const": "MEDIA_RELEASE_RECEIPT"},
              "source_key": {
                "properties": {
                  "kind": {"type": "string", "const": "MEDIA_RELEASE_RECEIPT"}
                }
              },
              "representation": {"type": "string", "const": "MR1_RECORD_V1"}
            }
          }
        ]
      },
      "Assignment": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "assignment_id": {"$ref": "#/components/schemas/ID"},
          "ownership_epoch": {"$ref": "#/components/schemas/PositiveUint64"},
          "assignee": {"$ref": "#/components/schemas/Peer"},
          "endpoint_id": {"$ref": "#/components/schemas/ID"},
          "config_revision": {"$ref": "#/components/schemas/PositiveUint64"},
          "assignment_ref": {"$ref": "#/components/schemas/Ref"}
        },
        "required": ["assignment_id", "ownership_epoch", "assignee", "endpoint_id", "config_revision", "assignment_ref"]
      },
      "Window": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "not_before": {"$ref": "#/components/schemas/Instant"},
          "expires_at": {"$ref": "#/components/schemas/Instant"},
          "max_clock_error_ns": {"$ref": "#/components/schemas/Uint64"},
          "clock_authority_ref": {"$ref": "#/components/schemas/Ref"}
