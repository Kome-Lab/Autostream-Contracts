                  "properties": {
                    "slot_key": {"$ref": "#/components/schemas/FenceRequest/properties/slot_key"}
                  }
                }
              ]
            },
            "properties": {
              "permit_ref": {"$ref": "#/components/schemas/FenceRequest/properties/permit_ref"}
            }
          },
          {
            "required": ["authority_ref", "slot_key"],
            "not": {
              "required": ["permit_ref"],
              "properties": {
                "permit_ref": {"$ref": "#/components/schemas/FenceRequest/properties/permit_ref"}
              }
            },
            "properties": {
              "authority_ref": {"$ref": "#/components/schemas/FenceRequest/properties/authority_ref"},
              "slot_key": {"$ref": "#/components/schemas/FenceRequest/properties/slot_key"}
            }
          }
        ]
      },
      "FenceObservation": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "original": {"$ref": "#/components/schemas/Original"},
          "scope": {"$ref": "#/components/schemas/Scope"},
          "responder": {"$ref": "#/components/schemas/Owner"},
          "observed_at": {"$ref": "#/components/schemas/Instant"},
          "observations": {
            "type": "array",
            "minItems": 1,
            "maxItems": 64,
            "uniqueItems": true,
            "items": {"$ref": "#/components/schemas/Observation"},
            "description": "A nonempty set in strictly increasing canonical byte order."
          },
          "permit_ref": {"$ref": "#/components/schemas/ReleasePermitRef"},
          "authority_ref": {"$ref": "#/components/schemas/Ref"},
          "slot_key": {"$ref": "#/components/schemas/Key"},
          "decision_ref": {"$ref": "#/components/schemas/Ref"}
        },
        "required": ["original", "scope", "responder", "observed_at", "observations"],
        "description": "Identify the exact owner of each observation. A committed decision requires an inspectable decision reference. Record revocation, durable gate fencing, joined operations, closed FD and remote terminal as separate facts.",
        "oneOf": [
          {
            "required": ["permit_ref"],
            "not": {
              "anyOf": [
                {
                  "required": ["authority_ref"],
                  "properties": {
                    "authority_ref": {"$ref": "#/components/schemas/FenceObservation/properties/authority_ref"}
                  }
                },
                {
                  "required": ["slot_key"],
                  "properties": {
                    "slot_key": {"$ref": "#/components/schemas/FenceObservation/properties/slot_key"}
                  }
                }
              ]
            },
            "properties": {
              "permit_ref": {"$ref": "#/components/schemas/FenceObservation/properties/permit_ref"}
            }
          },
          {
            "required": ["authority_ref", "slot_key"],
            "not": {
              "required": ["permit_ref"],
              "properties": {
                "permit_ref": {"$ref": "#/components/schemas/FenceObservation/properties/permit_ref"}
              }
            },
            "properties": {
              "authority_ref": {"$ref": "#/components/schemas/FenceObservation/properties/authority_ref"},
              "slot_key": {"$ref": "#/components/schemas/FenceObservation/properties/slot_key"}
            }
          }
        ]
      },
      "AdmissionRequest": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "record_key": {
            "allOf": [
              {"$ref": "#/components/schemas/Key"},
              {
                "properties": {
                  "kind": {"type": "string", "const": "CP_ADMISSION_PROOF"}
                }
              }
            ]
          },
          "original": {"$ref": "#/components/schemas/Original"},
          "claim_ref": {"$ref": "#/components/schemas/Ref"}
        },
        "required": ["record_key", "original", "claim_ref"],
        "description": "The CP resolves both originals, both primary assignments and its current reservation and fences independently."
      },
      "BindingRequest": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "record_key": {
            "allOf": [
              {"$ref": "#/components/schemas/Key"},
              {
                "properties": {
                  "kind": {"type": "string", "const": "WORKER_NON_MEDIA_BINDING"}
                }
              }
            ]
          },
          "original": {"$ref": "#/components/schemas/Original"},
          "cp_admission_ref": {"$ref": "#/components/schemas/CPAdmissionProofRef"}
        },
        "required": ["record_key", "original", "cp_admission_ref"],
        "description": "The Worker resolves the verified CP original and attests its own non-media fence, live process and generation."
      },
      "CoverRequest": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "record_key": {
            "allOf": [
              {"$ref": "#/components/schemas/Key"},
              {
                "properties": {
                  "kind": {"type": "string", "const": "APPLIED_COVER_PROOF"}
                }
              }
            ]
          },
          "original": {"$ref": "#/components/schemas/Original"},
          "cp_admission_ref": {"$ref": "#/components/schemas/CPAdmissionProofRef"},
          "worker_binding_ref": {"$ref": "#/components/schemas/WorkerNonMediaBindingRef"},
          "preparation_id": {"$ref": "#/components/schemas/ID"},
          "desired_cover_ref": {"$ref": "#/components/schemas/Ref"}
        },
        "required": ["record_key", "original", "cp_admission_ref", "worker_binding_ref", "preparation_id", "desired_cover_ref"],
        "description": "The Encoder resolves the intended preparation and observes the same closed graph. Submitting a desired revision never establishes applied cover."
      },
      "PermitRequest": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "record_key": {
            "allOf": [
              {"$ref": "#/components/schemas/Key"},
              {
                "properties": {
                  "kind": {"type": "string", "const": "MEDIA_RELEASE_PERMIT"}
                }
              }
            ]
          },
          "original": {"$ref": "#/components/schemas/Original"},
          "cp_admission_ref": {"$ref": "#/components/schemas/CPAdmissionProofRef"},
          "worker_binding_ref": {"$ref": "#/components/schemas/WorkerNonMediaBindingRef"},
          "applied_cover_ref": {"$ref": "#/components/schemas/AppliedCoverProofRef"},
          "scope": {"$ref": "#/components/schemas/Scope"},
          "release_attempt_id": {"$ref": "#/components/schemas/ID"},
          "logical_effect_key": {"$ref": "#/components/schemas/ID"},
          "connection_operation_id": {"$ref": "#/components/schemas/ID"},
          "slot_reservation_ref": {"$ref": "#/components/schemas/Ref"}
        },
        "required": [
          "record_key",
          "original",
          "cp_admission_ref",
          "worker_binding_ref",
          "applied_cover_ref",
          "scope",
          "release_attempt_id",
          "logical_effect_key",
          "connection_operation_id",
          "slot_reservation_ref"
        ],
        "description": "The CP verifies every referenced original and the target owner’s closed slot reservation before issuing the permit."
      },
      "OpenRequest": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "connection_operation_id": {"$ref": "#/components/schemas/ID"},
          "logical_effect_key": {"$ref": "#/components/schemas/ID"},
          "permit_ref": {"$ref": "#/components/schemas/ReleasePermitRef"},
          "receipt_key": {
            "allOf": [
              {"$ref": "#/components/schemas/Key"},
              {
                "properties": {
                  "kind": {"type": "string", "const": "MEDIA_RELEASE_RECEIPT"}
                }
              }
            ]
          }
        },
        "required": ["connection_operation_id", "logical_effect_key", "permit_ref", "receipt_key"],
        "description": "Immutable original command at the sole consumer. Domain-separated digest uses exactly these four fields. Resolve the target slot, expected revision, parent attempt and expiry from the referenced original permit."
      },
      "Error": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "code": {
            "type": "string",
            "enum": ["INVALID_RECORD", "UNAUTHENTICATED", "FORBIDDEN", "CONFLICT", "EXPIRED", "REVOKED", "HELD", "UNKNOWN"]
          }
        },
        "required": ["code"],
        "description": "A non-secret machine-readable reason; never discloses the existence of a record to an unauthorized caller."
      }
    }
  }
}
