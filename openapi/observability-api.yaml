openapi: 3.1.0
info:
  title: AutoStream Observability API
  version: 0.2.0
x-autostream-remediation-authority:
  role: detect_propose_evidence
  proposal_destination: control_panel
  evidence_destination: control_panel
  local_execution_scope: enumerated_observability_local_transitions_only
  may_mint_cross_service_grant: false
  may_execute_host_runtime: false
  may_call_updater_directly: false
  may_use_shared_control_panel_database_credentials: false
  denied_actions: [delete_archives, rotate_credentials, change_roles, stop_live_stream, recreate_youtube_broadcast, revoke_service_tokens]
  proposal_schema: {$ref: '#/components/schemas/RemediationProposal'}
  local_transition_schema: {$ref: '#/components/schemas/ObservabilityLocalRemediationTransition'}
servers:
  - url: https://observability.example.com
security:
  - bearerToken: []
paths:
  /health:
    get:
      security: []
      responses:
        "200":
          description: healthy
  /updater/version:
    get:
      operationId: getUpdaterVersion
      summary: Read the Observability application runtime identity
      description: >
        Historical route name retained without introducing a /v2 URI prefix. This is
        an application-owned runtime identity probe consumed by the Local Executor
        during update verification; it is not Updater health. The current source has
        no explicit route-level no-store behavior. A later consumer implementation
        must emit the exact Cache-Control no-store response declared here.
      x-autostream-semantic-name: application_runtime_identity_probe
      x-autostream-current-source-cache-control: no_explicit_route_level_no_store
      x-autostream-v2-target-cache-control: no-store
      security: []
      responses:
        "200":
          description: Observability runtime identity
          headers:
            Cache-Control:
              required: true
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [version, service_id, service_type, config_revision]
                allOf:
                  - required: [version]
                properties:
                  version:
                    type: string
                    pattern: '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$'
                    example: v2.0.0
                  service_id:
                    type: string
                    minLength: 1
                    maxLength: 128
                    pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
                  service_type: {type: string, const: observability}
                  config_revision: {type: integer, minimum: 1}
        "503":
          description: Observability runtime identity is unavailable; the response is safe and contains no raw configuration
          headers:
            Cache-Control:
              required: true
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [code, message]
                properties:
                  code: {type: string, enum: [application_probe_unavailable, application_probe_identity_invalid, application_probe_revision_unknown]}
                  message: {type: string, maxLength: 240}
        "405":
          description: method not allowed
          headers:
            Cache-Control:
              required: true
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [code, message]
                properties:
                  code: {type: string, const: method_not_allowed}
                  message: {type: string, maxLength: 240}

  /status:
    get:
      security: []
      responses:
        "200":
          description: service status
  /heartbeat:
    post:
      responses:
        "202":
          description: heartbeat accepted
  /signals:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObservabilitySignal"
      responses:
        "202":
          description: signal accepted; incidents may be returned
    get:
      responses:
        "200":
          description: recent signals
  /metrics:
    get:
      responses:
        "200":
          description: latest metric snapshots
  /incidents:
    get:
      responses:
        "200":
          description: incidents
  /incidents/{id}:
    get:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: incident detail
  /incidents/{id}/diagnostics/rerun:
    post:
      description: Re-evaluates the diagnostic report from the incident's already persisted signal. Requires diagnostics.run and never changes incident lifecycle, executes remediation, or sends notifications.
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: diagnostic report re-evaluated or safely left inconclusive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticRerunResponse"
        "401":
          description: missing or invalid bearer token
        "403":
          description: missing diagnostics.run scope
        "404":
          description: incident not found
        "500":
          description: persisted incident, signal, or diagnostic report update failed
  /incidents/{id}/acknowledge:
    post:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: incident acknowledged
  /incidents/{id}/resolve:
    post:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: incident resolved
  /diagnostics:
    get:
      responses:
        "200":
          description: diagnostic reports
  /remediation-actions:
    get:
      responses:
        "200":
          description: remediation actions
  /remediation-actions/{id}/dispatch-context:
    get:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: verified remediation action / incident / stream context for Control Panel dispatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemediationDispatchContext"
        "404":
          description: remediation action not found
        "409":
          description: incident context missing, stream context missing, or action is not executable
  /remediation-actions/{id}/approve:
    post:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: remediation action approved
  /remediation-actions/{id}/execute:
    post:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: safe or approved remediation action recorded
        "403":
          description: dangerous or unapproved action blocked
  /notification-deliveries:
    get:
      responses:
        "200":
          description: notification delivery history with masked targets
  /notification-channels:
    get:
      responses:
        "200":
          description: notification channels without raw webhook URLs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationChannel"
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationChannelCreateRequest"
      responses:
        "201":
          description: notification channel created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationChannel"
        "400":
          description: invalid notification channel or webhook URL
  /notification-channels/{id}:
    get:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: notification channel detail without raw webhook URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationChannel"
    put:
      parameters: [{$ref: "#/components/parameters/id"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationChannelWriteRequest"
      responses:
        "200":
          description: notification channel updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationChannel"
        "400":
          description: invalid notification channel or webhook URL
    delete:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: notification channel deleted
  /notification-channels/{id}/test:
    post:
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "202":
          description: test notification attempted
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationDeliveryResult"
  /notification-events:
    post:
      summary: Deliver a secret-free administrative notification event
      operationId: createNotificationEvent
      security:
        - bearerToken: []
      description: Accepts either the configured Control Panel service bearer or an administrator bearer authorized for notifications.manage. The request contains only structured, secret-free notification context; unknown fields are rejected. Raw tokens, credentials, webhook URLs, passwords, authorization values, or other secrets must never be supplied. event_id and outbox/idempotency semantics are not part of this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationEventWriteRequest"
      responses:
        "202":
          description: delivery attempts completed; targets and errors are masked or sanitized
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationDeliveryResult"
        "400":
          description: bad_request, event_type_required, or invalid_notification_event; metadata and other unknown fields are rejected
        "401":
          description: invalid_service_token
        "403":
          description: missing_admin_scope
        "429":
          description: rate_limited
        "503":
          description: rate_limit_unavailable
components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    RemediationProposalEvidence:
      type: object
      additionalProperties: false
      required: [evidence_code, observed_at, observed_revision]
      properties:
        evidence_code:
          type: string
          enum: [incident_detected, diagnostic_confirmed, retry_eligible, host_symptom_confirmed]
        observed_at: {type: string, format: date-time}
        observed_revision: {type: integer, format: int64, minimum: 1}
        evidence_digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
      description: Bounded secret-safe evidence. Raw logs, payloads, credentials, configuration, and command output are prohibited.
    RemediationProposal:
      type: object
      additionalProperties: false
      required:
        - proposal_id
        - incident_id
        - detector
        - target
        - action_type
        - proposal_revision
        - required_capability
        - evidence
        - audit_correlation_id
        - observed_at
        - control_panel_authorization_required
      properties:
        proposal_id: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
        incident_id: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
        detector:
          type: object
          additionalProperties: false
          required: [service_id, service_type]
          properties:
            service_id: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
            service_type: {type: string, const: observability}
        target:
          type: object
          additionalProperties: false
          required: [service_id, service_type]
          properties:
            service_id: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
            service_type: {type: string, enum: [control_panel, worker, encoder_recorder, discord_bot, observability]}
            host_id: {type: string, minLength: 1, maxLength: 191, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,190}$'}
        action_type:
          type: string
          enum: [host.systemd, host.docker, host.update, host.bootstrap, host.port, host.self_update, application.retry_gdrive_upload, application.retry_package_remux]
        proposal_revision: {type: integer, format: int64, minimum: 1}
        required_capability:
          type: string
          enum: [host.systemd, host.docker, host.update, host.bootstrap, host.port, host.self_update, application.retry_gdrive_upload, application.retry_package_remux]
        evidence:
          type: array
          minItems: 1
          maxItems: 32
          items: {$ref: '#/components/schemas/RemediationProposalEvidence'}
        audit_correlation_id: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
        observed_at: {type: string, format: date-time}
        control_panel_authorization_required: {type: boolean, const: true}
      allOf:
        - if: {properties: {action_type: {const: host.systemd}}, required: [action_type]}
          then: {properties: {target: {required: [host_id]}, required_capability: {const: host.systemd}}}
        - if: {properties: {action_type: {const: host.docker}}, required: [action_type]}
          then: {properties: {target: {required: [host_id]}, required_capability: {const: host.docker}}}
        - if: {properties: {action_type: {const: host.update}}, required: [action_type]}
          then: {properties: {target: {required: [host_id]}, required_capability: {const: host.update}}}
        - if: {properties: {action_type: {const: host.bootstrap}}, required: [action_type]}
          then: {properties: {target: {required: [host_id]}, required_capability: {const: host.bootstrap}}}
        - if: {properties: {action_type: {const: host.port}}, required: [action_type]}
          then: {properties: {target: {required: [host_id]}, required_capability: {const: host.port}}}
        - if: {properties: {action_type: {const: host.self_update}}, required: [action_type]}
          then: {properties: {target: {required: [host_id]}, required_capability: {const: host.self_update}}}
        - if: {properties: {action_type: {const: application.retry_gdrive_upload}}, required: [action_type]}
          then: {properties: {target: {properties: {service_type: {const: encoder_recorder}}}, required_capability: {const: application.retry_gdrive_upload}}}
        - if: {properties: {action_type: {const: application.retry_package_remux}}, required: [action_type]}
          then: {properties: {target: {properties: {service_type: {const: encoder_recorder}}}, required_capability: {const: application.retry_package_remux}}}
      description: Observability may detect and propose only. This object is not a grant and cannot name an executor, mint authority, or invoke Updater directly.
    ObservabilityLocalRemediationTransition:
      type: object
      additionalProperties: false
      required: [action_id, action_type, expected_revision, fence, idempotency_key, audit_correlation_id]
      properties:
        action_id: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
        action_type: {type: string, enum: [refresh_service_status, rerun_diagnostics, clear_stale_warning]}
        expected_revision: {type: integer, format: int64, minimum: 1}
        fence: {type: integer, format: int64, minimum: 1}
        idempotency_key: {type: string, minLength: 1, maxLength: 128, pattern: '^[^\u0000-\u001F\u007F]+$'}
        audit_correlation_id: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
      description: The complete enumerated Observability-local execution scope. Host and cross-service actions are not representable.
    ObservabilitySignal:
      type: object
      required: [type, name, service_id, service_type]
      properties:
        type:
          enum: [heartbeat, metric, log, event, warning, error, incident, diagnostic_report, remediation_action, notification_event]
        name:
          type: string
        service_id:
          type: string
        service_type:
          enum: [discord_bot, encoder_recorder, worker, observability]
        stream_id:
          type: string
        status:
          type: string
        value:
          type: number
        metrics:
          type: object
          additionalProperties:
            type: number
        attributes:
          type: object
          additionalProperties: true
        timestamp:
          type: string
          format: date-time
    NotificationEventWriteRequest:
      type: object
      additionalProperties: false
      required: [event_type, action]
      description: Secret-free administrative notification event with structured source and detail fields. metadata and all other unknown properties are rejected. Raw credentials, tokens, webhook URLs, passwords, and authorization values are prohibited in every field.
      properties:
        event_type:
          type: string
          const: admin.audit
        severity:
          type: string
          enum: [info, warning, error, critical]
          default: info
        status:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
          description: Short non-secret status identifier. Defaults to recorded when omitted.
        action:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9_]+(?:\.[A-Za-z0-9_]+)*$'
          description: Required stable dotted ASCII identifier; raw values are prohibited.
        service_id:
          type: string
          minLength: 1
          maxLength: 160
          pattern: '^[^\u0000-\u001F\u007F]+$'
          description: Source service identifier. When omitted, the producer is treated as control-panel; the receiving Observability service is never inferred as the source.
        resource_type:
          type: string
          minLength: 1
          maxLength: 80
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
          description: Non-secret resource type identifier.
        resource_id:
          type: string
          minLength: 1
          maxLength: 160
          pattern: '^[^\u0000-\u001F\u007F]+$'
          description: Non-secret opaque resource identifier. URLs, credentials, tokens, and control characters are prohibited.
        actor_username:
          type: string
          minLength: 1
          maxLength: 80
          pattern: '^[^\u0000-\u001F\u007F]+$'
          description: Display-safe non-secret actor name; control characters are prohibited.
        summary:
          type: string
          minLength: 1
          maxLength: 240
          pattern: '^[^\u0000-\u001F\u007F]+$'
          description: Short display-safe summary. Raw secrets, URLs carrying credentials, and control characters are prohibited.
        details:
          type: string
          minLength: 1
          maxLength: 3000
          pattern: '^[^\u0000-\u001F\u007F]+$'
          description: Optional display-safe diagnostic or operation details. Raw secrets, URLs carrying credentials, and control characters are prohibited.
        timestamp:
          type: string
          format: date-time
          maxLength: 40
          description: Optional source event time. It is context only and not an outbox or idempotency identifier.
    NotificationDeliveryResult:
      type: object
      additionalProperties: false
      required: [event_type, channel, target, status]
      properties:
        event_type:
          type: string
          enum: [stream.started, stream.live, stream.completed, stream.failed, stream.warning, stream.error, incident.opened, incident.updated, incident.resolved, diagnostic.created, remediation.pending_approval, remediation.executed, archive.upload.completed, archive.upload.failed, service.offline, service.recovered, admin.audit]
        channel:
          type: string
          enum: [discord, slack, generic, email]
        target:
          type: string
          minLength: 1
          maxLength: 512
          pattern: '^[^\u0000-\u001F\u007F]+$'
          description: Masked delivery target only. Raw webhook URLs and email recipient addresses are never returned.
        status:
          type: string
          enum: [success, failure]
        error:
          type: string
          maxLength: 512
          pattern: '^[^\u0000-\u001F\u007F]*$'
          description: Optional sanitized error. Raw provider responses, target URLs, credentials, and tokens are never returned.
    NotificationChannel:
      type: object
      required: [id, name, type, enabled, uses_global_smtp, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          enum: [discord, slack, generic, email]
        enabled:
          type: boolean
        uses_global_smtp:
          type: boolean
          description: Whether this email channel delegates delivery to the Control Panel service relay using globally managed application SMTP settings. This reveals no SMTP credentials.
        masked_webhook_url:
          type: string
          description: Raw webhook URL is never returned.
        masked_email_target:
          type: string
          description: Raw email recipients and SMTP settings are never returned as unmasked response fields.
        severity_filter:
          type: array
          items:
            enum: [info, warning, error, critical]
        event_type_filter:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    NotificationChannelWriteRequest:
      type: object
      additionalProperties: false
      required: [name, type, enabled]
      allOf:
        - if:
            required: [uses_global_smtp]
          then:
            properties:
              type: { const: email }
      properties:
        name:
          type: string
        type:
          enum: [discord, slack, generic, email]
        enabled:
          type: boolean
        webhook_url:
          type: string
          format: uri
          pattern: "^https?://"
          writeOnly: true
          description: Write-only secret. Only http/https absolute URLs are accepted.
        email_recipients:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            format: email
            maxLength: 320
            pattern: '^[^\r\n]+$'
            description: Bare mailbox address only; display names and CR/LF are rejected.
          description: Required for email-channel creation. On update, omission preserves the existing masked recipient set; when supplied, the array must be non-empty.
        uses_global_smtp:
          type: boolean
          const: true
          description: Email delivery is delegated to the authenticated Control Panel relay backed by globally managed SMTP settings.
        severity_filter:
          type: array
          items:
            enum: [info, warning, error, critical]
        event_type_filter:
          type: array
          items:
            type: string
    NotificationChannelCreateRequest:
      allOf:
        - $ref: "#/components/schemas/NotificationChannelWriteRequest"
        - if:
            required: [type]
            properties:
              type:
                const: email
          then:
            required: [email_recipients, uses_global_smtp]
            properties:
              email_recipients: {}
              uses_global_smtp: { const: true }
    RemediationDispatchContext:
      type: object
      additionalProperties: false
      required: [action_id, action, action_status, incident_id, incident_status, stream_id, executable]
      properties:
        action_id:
          type: string
        action:
          enum: [retry_gdrive_upload, retry_package_remux]
        action_status:
          type: string
        incident_id:
          type: string
        incident_status:
          type: string
        stream_id:
          type: string
        executable:
          type: boolean
    DiagnosticRerunResponse:
      $ref: "../schemas/diagnostic-rerun-response.schema.json"
