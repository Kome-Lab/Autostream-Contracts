openapi: 3.1.0
info:
  title: AutoStream Encoder Recorder API
  version: 0.1.0
servers:
  - url: https://encoder.internal.example.com
security:
  - serviceToken: []
paths:
  /updater/version:
    get:
      operationId: getUpdaterVersion
      summary: Read the Encoder Recorder application runtime identity
      description: >
        Historical route name retained without introducing a /v2 URI prefix. This is
        an application-owned runtime identity probe consumed by the Local Executor
        during update verification; it is not Updater health. The current source has
        no explicit route-level no-store behavior. A later consumer implementation
        must emit the exact Cache-Control no-store response declared here.
      x-autostream-semantic-name: application_runtime_identity_probe
      x-autostream-current-source-cache-control: no_explicit_route_level_no_store
      x-autostream-v2-target-cache-control: no-store
      security: []
      responses:
        "200":
          description: Encoder Recorder runtime identity
          headers:
            Cache-Control:
              required: true
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [version, service_id, service_type, config_revision]
                allOf:
                  - required: [version]
                properties:
                  version:
                    type: string
                    pattern: '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$'
                    example: v2.0.0
                  service_id:
                    type: string
                    minLength: 1
                    maxLength: 128
                    pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
                  service_type: {type: string, const: encoder_recorder}
                  config_revision: {type: integer, minimum: 1}
        "503":
          description: Encoder Recorder runtime identity is unavailable; the response is safe and contains no raw configuration
          headers:
            Cache-Control:
              required: true
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [code, message]
                properties:
                  code: {type: string, enum: [application_probe_unavailable, application_probe_identity_invalid, application_probe_revision_unknown]}
                  message: {type: string, maxLength: 240}
        "405":
          description: method not allowed
          headers:
            Cache-Control:
              required: true
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [code, message]
                properties:
                  code: {type: string, const: method_not_allowed}
                  message: {type: string, maxLength: 240}

  /streams/start:
    post:
      operationId: startStream
      summary: Start an Encoder/Recorder stream
      description: >
        Internal Control Panel dispatch. When worker_video_ingest is true, the
        Encoder/Recorder allocates a job-scoped SRT listener for Worker JPEG
        scene frames and returns its
        connection material only in this internal service-to-service response.
        The dispatcher must remove video_ingest before writing status, audit
        metadata, logs, or any public Control Panel response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EncoderStartStreamRequest"
      responses:
        "202":
          description: stream start accepted; optional Worker scene-frame ingest is internal-only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EncoderStartStreamResponse"
        "400":
          description: invalid start payload or media configuration
        "401":
          description: service token missing or invalid
        "409":
          description: stream already running or output relay state conflict
        "500":
          description: Encoder/Recorder could not allocate or start the stream
        "503":
          description: Worker video ingest is unavailable or could not allocate its encrypted SRT listener

  /streams/{id}/runtime-settings:
    put:
      operationId: updateStreamRuntimeSettings
      summary: Change per-stream Encoder gain and watermark without restarting FFmpeg
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, minLength: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EncoderRuntimeSettingsRequest"
      responses:
        "200": {description: settings applied to the running Encoder process}
        "400": {description: invalid gain or watermark profile data}
        "401": {description: service token missing or invalid}
        "409": {description: stream is not running}
        "502": {description: FFmpeg runtime command or watermark source update failed}

  /streams/{id}/preview/{name}:
    get:
      operationId: getStreamPreviewAsset
      summary: Read an HLS preview asset
      description: >
        Service-token-protected preview source for Control Panel. Encoder Recorder creates
        approximately two-second HLS segments and keeps the full active-stream playlist so
        an authorized preview can seek back to the beginning while the stream is running.
        Preview output is isolated from the primary live output and recording; preview
        backpressure or failure must not stop either primary output.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: name
          in: path
          required: true
          schema:
            type: string
            pattern: "^(index\\.m3u8|segment-[0-9]{6}\\.ts)$"
      responses:
        "200":
          description: HLS playlist or complete MPEG-TS segment
          headers:
            Vary:
              schema:
                type: string
              description: Authorization
            Cache-Control:
              schema:
                type: string
              description: no-store for playlists; private, max-age=30 for segments
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
            video/mp2t:
              schema:
                type: string
                format: binary
        "206":
          description: MPEG-TS byte range
          content:
            video/mp2t:
              schema:
                type: string
                format: binary
        "400":
          description: invalid stream path, asset name, symlink, or file identity
        "401":
          description: service token missing or invalid
        "404":
          description: preview asset is not ready
components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      description: Node/service token supplied by Control Panel. It must never be embedded in a browser or VLC URL.
  schemas:
    EncoderStartStreamRequest:
      $ref: "../schemas/encoder-start-stream-request.schema.json"
    EncoderStartStreamResponse:
      $ref: "../schemas/encoder-start-stream-response.schema.json"
    EncoderRuntimeSettingsRequest:
      $ref: "../schemas/encoder-runtime-settings-request.schema.json"
