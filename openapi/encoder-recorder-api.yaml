openapi: 3.1.0
info:
  title: AutoStream Encoder Recorder API
  version: 0.1.0
servers:
  - url: https://encoder.internal.example.com
security:
  - serviceToken: []
paths:
  /updater/version:
    get:
      operationId: getUpdaterVersion
      summary: Read the Encoder Recorder application runtime identity
      description: >
        Historical route name retained without introducing a /v2 URI prefix. This is
        an application-owned runtime identity probe consumed by the Local Executor
        during update verification; it is not Updater health. The current source has
        no explicit route-level no-store behavior. A later consumer implementation
        must emit the exact Cache-Control no-store response declared here.
      x-autostream-semantic-name: application_runtime_identity_probe
      x-autostream-current-source-cache-control: no_explicit_route_level_no_store
      x-autostream-v2-target-cache-control: no-store
      security: []
      responses:
        "200":
          description: Encoder Recorder runtime identity
          headers:
            Cache-Control:
              required: true
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [version, service_id, service_type, config_revision]
                allOf:
                  - required: [version]
                properties:
                  version:
                    type: string
                    pattern: '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$'
                    example: v2.0.0
                  service_id:
                    type: string
                    minLength: 1
                    maxLength: 128
                    pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
                  service_type: {type: string, const: encoder_recorder}
                  config_revision: {type: integer, minimum: 1}
        "503":
          description: Encoder Recorder runtime identity is unavailable; the response is safe and contains no raw configuration
          headers:
            Cache-Control:
              required: true
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [code, message]
                properties:
                  code: {type: string, enum: [application_probe_unavailable, application_probe_identity_invalid, application_probe_revision_unknown]}
                  message: {type: string, maxLength: 240}
        "405":
          description: method not allowed
          headers:
            Cache-Control:
              required: true
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [code, message]
                properties:
                  code: {type: string, const: method_not_allowed}
                  message: {type: string, maxLength: 240}

  /streams/start:
    post:
      operationId: startStream
      summary: Start an Encoder/Recorder stream
      description: >
        Synchronous legacy dispatch for independent non-managed inputs.
        Managed Worker input is rejected with 409 start_preparation_required
        before config, secret resolution, bridge allocation or process creation.
        Managed producers must negotiate stream_start_prepare_commit_v2 and use
        prepare, normal Worker start, commit, Bot start, then final CP live.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EncoderStartStreamRequest"
      responses:
        "202":
          description: stream start accepted; optional Worker scene-frame ingest is internal-only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EncoderStartStreamResponse"
        "400":
          description: invalid start payload or media configuration
        "401":
          description: service token missing or invalid
        "409":
          description: stream already running or output relay state conflict
        "500":
          description: Encoder/Recorder could not allocate or start the stream
        "503":
          description: Worker video ingest is unavailable or could not allocate its encrypted SRT listener

  /streams/start-preparations:
    post:
      operationId: prepareStreamStart
      summary: prepareStreamStart
      description: >
        Internal generation and node bound start transaction. Prepare is starting,
        never running or applied. Commit requires a real Cover feed and output
        advance witness. Only prepare returns secret video_ingest transport.
        Connection material belongs only in this internal service-to-service response.
        The dispatcher must remove video_ingest before writing status, audit
        metadata, logs, or any public Control Panel response.
        Unknown ownership is not permission to retry or stop another attempt.
      x-autostream-capability: stream_start_prepare_commit_v2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/encoder-start-preparation-request.schema.json"
      responses:
        "202":
          description: Exact phase and identity; prepared is not final success
          headers:
            Cache-Control:
              required: true
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../schemas/encoder-start-preparation-prepared.schema.json"
        "400":
          description: Strict body or path identity invalid
          headers:
            Cache-Control:
              required: true
              schema: {type: string, const: no-store}
        "401":
          description: Service token missing or invalid
          headers:
            Cache-Control:
              required: true
              schema: {type: string, const: no-store}
        "403":
          description: Service transport or identity denied
          headers:
            Cache-Control:
              required: true
              schema: {type: string, const: no-store}
        "404":
          description: Unknown preparation; no positive outcome
          headers:
            Cache-Control:
              required: true
              schema: {type: string, const: no-store}
        "409":
          description: Wrong identity, phase, generation or owner conflict
          headers:
            Cache-Control:
              required: true
              schema: {type: string, const: no-store}
        "502":
          description: Bounded runtime failure
          headers:
            Cache-Control:
              required: true
              schema: {type: string, const: no-store}
        "503":
          description: Required runtime unavailable
          headers:
            Cache-Control:
              required: true
              schema: {type: string, const: no-store}

  /streams/{id}/start-preparations/{start_id}:
    get:
      operationId: getStreamStartPreparation
      summary: getStreamStartPreparation
      description: >
        Internal generation and node bound start transaction. Prepare is starting,
        never running or applied. Commit requires a real Cover feed and output
        advance witness. Only prepare returns secret video_ingest transport.
        Unknown ownership is not permission to retry or stop another attempt.
      x-autostream-capability: stream_start_prepare_commit_v2
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, minLength: 1}
        - name: start_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Exact phase and identity; prepared is not final success
          headers:
            Cache-Control:
              required: true
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../schemas/encoder-start-preparation-status.schema.json"
        "400":
          description: Strict body or path identity invalid
          headers:
            Cache-Control:
              required: true
              schema: {type: string, const: no-store}
        "401":
          description: Service token missing or invalid
          headers:
            Cache-Control:
              required: true
              schema: {type: string, const: no-store}
        "403":
          description: Service transport or identity denied
          headers:
            Cache-Control:
              required: true
              schema: {type: string, const: no-store}
        "404":
          description: Unknown preparation; no positive outcome
          headers:
            Cache-Control:
              required: true
              schema: {type: string, const: no-store}
        "409":
          description: Wrong identity, phase, generation or owner conflict
          headers:
            Cache-Control:
              required: true
              schema: {type: string, const: no-store}
        "502":
          description: Bounded runtime failure
          headers:
            Cache-Control:
              required: true
              schema: {type: string, const: no-store}
        "503":
          description: Required runtime unavailable
          headers:
            Cache-Control:
              required: true
              schema: {type: string, const: no-store}

  /streams/{id}/start-preparations/{start_id}/commit:
    post:
      operationId: commitStreamStartPreparation
      summary: commitStreamStartPreparation
      description: >
        Internal generation and node bound start transaction. Prepare is starting,
        never running or applied. Commit requires a real Cover feed and output
        advance witness. Only prepare returns secret video_ingest transport.
        Unknown ownership is not permission to retry or stop another attempt.
      x-autostream-capability: stream_start_prepare_commit_v2
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, minLength: 1}
        - name: start_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      x-autostream-path-body-equality: {id: stream_id, start_id: start_id}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/encoder-start-preparation-action.schema.json"
      responses:
        "200":
          description: Exact phase and identity; prepared is not final success
          headers:
            Cache-Control:
              required: true
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../schemas/encoder-start-preparation-status.schema.json"
                  - properties: {phase: {const: running}}
        "400":
          description: Strict body or path identity invalid
          headers:
            Cache-Control:
              required: true
              schema: {type: string, const: no-store}
        "401":
          description: Service token missing or invalid
          headers:
            Cache-Control:
              required: true
              schema: {type: string, const: no-store}
        "403":
          description: Service transport or identity denied
          headers:
            Cache-Control:
              required: true
              schema: {type: string, const: no-store}
        "404":
          description: Unknown preparation; no positive outcome
          headers:
            Cache-Control:
              required: true
              schema: {type: string, const: no-store}
        "409":
          description: Wrong identity, phase, generation or owner conflict
          headers:
            Cache-Control:
              required: true
              schema: {type: string, const: no-store}
        "502":
          description: Bounded runtime failure
          headers:
            Cache-Control:
              required: true
              schema: {type: string, const: no-store}
        "503":
          description: Required runtime unavailable
          headers:
            Cache-Control:
              required: true
              schema: {type: string, const: no-store}

  /streams/{id}/start-preparations/{start_id}/abort:
    post:
      operationId: abortStreamStartPreparation
      summary: abortStreamStartPreparation
      description: >
        Internal generation and node bound start transaction. Prepare is starting,
        never running or applied. Commit requires a real Cover feed and output
        advance witness. Only prepare returns secret video_ingest transport.
        Unknown ownership is not permission to retry or stop another attempt.
      x-autostream-capability: stream_start_prepare_commit_v2
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, minLength: 1}
        - name: start_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      x-autostream-path-body-equality: {id: stream_id, start_id: start_id}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/encoder-start-preparation-action.schema.json"
      responses:
        "200":
          description: Exact phase and identity; prepared is not final success
          headers:
            Cache-Control:
              required: true
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../schemas/encoder-start-preparation-status.schema.json"
                  - properties: {phase: {const: aborted}}
        "400":
          description: Strict body or path identity invalid
          headers:
            Cache-Control:
              required: true
              schema: {type: string, const: no-store}
        "401":
          description: Service token missing or invalid
          headers:
            Cache-Control:
              required: true
              schema: {type: string, const: no-store}
        "403":
          description: Service transport or identity denied
          headers:
            Cache-Control:
              required: true
              schema: {type: string, const: no-store}
        "404":
          description: Unknown preparation; no positive outcome
          headers:
            Cache-Control:
              required: true
              schema: {type: string, const: no-store}
        "409":
          description: Wrong identity, phase, generation or owner conflict
          headers:
            Cache-Control:
              required: true
              schema: {type: string, const: no-store}
        "502":
          description: Bounded runtime failure
          headers:
            Cache-Control:
              required: true
